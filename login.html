<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kyle | Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(75, 5, 30, 0.4),
          transparent 40%
        ),
        #030303;
    }
    .login-container {
      width: 90%;
      max-width: 430px;
      padding: 45px 38px;
      background:
        linear-gradient(
          145deg,
          rgba(65, 5, 27, 0.3),
          rgba(8, 8, 8, 0.9)
        );
      border: 1px solid rgba(120, 20, 55, 0.45);
      border-radius: 20px;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.7),
        inset 0 0 50px rgba(70, 5, 30, 0.08);
      backdrop-filter: blur(20px);
    }
    .logo {
      text-align: center;
      margin-bottom: 35px;
    }
    .logo h1 {
      font-size: 28px;
      letter-spacing: 8px;
      margin-bottom: 8px;
    }
    .logo p {
      color: #7e7e7e;
      font-size: 12px;
      letter-spacing: 2px;
    }
    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .tabs button {
      flex: 1;
      padding: 14px;
      border: none;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
    }
    .tabs button.active {
      color: #a32650;
      border-bottom-color: #7d1639;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #a0a0a0;
      font-size: 12px;
    }
    .form-group input {
      width: 100%;
      padding: 15px;
      color: white;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(120,20,55,0.35);
      border-radius: 5px;
      outline: none;
      font-size: 14px;
      transition: 0.3s;
    }
    .form-group input:focus {
      border-color: #8e1d43;
      box-shadow: 0 0 20px rgba(100,10,45,0.15);
    }
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0 25px;
      font-size: 12px;
    }
    .remember {
      display: flex;
      gap: 7px;
      align-items: center;
      color: #777;
    }
    .remember input {
      accent-color: #7d1639;
    }
    .forgot {
      color: #96254c;
      text-decoration: none;
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 5px;
      color: white;
      background:
        linear-gradient(
          135deg,
          #43091e,
          #7d1639
        );
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      box-shadow:
        0 12px 35px rgba(70,5,30,0.3);
    }
    .submit-btn:hover {
      transform: translateY(-3px);
      background:
        linear-gradient(
          135deg,
          #5a0c28,
          #941e49
        );
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 25px 0;
      color: #555;
      font-size: 11px;
    }
    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(255,255,255,0.08);
    }
    .social-login {
      display: flex;
      gap: 10px;
    }
    .social-login button {
      flex: 1;
      padding: 13px;
      color: #aaa;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    .social-login button:hover {
      border-color: rgba(130,20,55,0.5);
      color: white;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #666;
      text-decoration: none;
      font-size: 12px;
    }
    .back:hover {
      color: #9d2850;
    }
    #signup {
      display: none;
    }
    @media (max-width: 500px) {
      .login-container {
        padding: 35px 25px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>KYLE</h1>
      <p>OFFICIAL WEBSITE</p>
    </div>
    <div class="tabs">
      <button
        id="loginTab"
        class="active"
        onclick="showLogin()">
        Login
      </button>
      <button
        id="signupTab"
        onclick="showSignup()">
        Sign Up
      </button>
    </div>
    <!-- LOGIN -->
    <form id="login" onsubmit="loginUser(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          placeholder="Enter your email"
          required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          placeholder="Enter your password"
          required>
      </div>
      <div class="options">
        <label class="remember">
          <input type="checkbox">
          Remember me
        </label>
        <a href="#" class="forgot">
          Forgot password?
        </a>
      </div>
      <button type="submit" class="submit-btn">
        LOGIN
      </button>
    </form>
    <!-- SIGN UP -->
    <form id="signup">
      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          placeholder="Enter your name"
          required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          placeholder="Enter your email"
          required>
      </div>
      <div class="form-group">
        <label>Create Password</label>
        <input
          type="password"
          placeholder="Create a password"
          required>
      </div>
      <button type="submit" class="submit-btn">
        CREATE ACCOUNT
      </button>
    </form>
    <div class="divider">
      OR CONTINUE WITH
    </div>
    <div class="social-login">
      <button type="button">
        Google
      </button>
      <button type="button">
        Apple
      </button>
    </div>
    <a href="index.html" class="back">
      ← Back to website
    </a>
  </div>
  <!-- FIREBASE -->
  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyATyGLNPuSu3GMxWjFBijyk2mu57GkVZo4",
      authDomain: "kyle-official-website.firebaseapp.com",
      projectId: "kyle-official-website",
      storageBucket: "kyle-official-website.firebasestorage.app",
      messagingSenderId: "547868923755",
      appId: "1:547868923755:web:a85ffecce9bf9cc6ff5e2e",
      measurementId: "G-799CW529X9"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    /* LOGIN / SIGNUP TABS */
    window.showLogin = function () {
      document.getElementById("login").style.display = "block";
      document.getElementById("signup").style.display = "none";
      document.getElementById("loginTab").classList.add("active");
      document.getElementById("signupTab").classList.remove("active");
    };
    window.showSignup = function () {
      document.getElementById("login").style.display = "none";
      document.getElementById("signup").style.display = "block";
      document.getElementById("loginTab").classList.remove("active");
      document.getElementById("signupTab").classList.add("active");
    };
    /* LOGIN */
    window.loginUser = async function (event) {
      event.preventDefault();
      const email =
        document.querySelector(
          "#login input[type='email']"
        ).value;
      const password =
        document.querySelector(
          "#login input[type='password']"
        ).value;
      try {
        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );
        window.location.href = "dashboard.html";
      } catch (error) {
        alert("Login failed: " + error.message);
      }
    };
    /* SIGN UP */
    document
      .getElementById("signup")
      .addEventListener("submit", async function (event) {
        event.preventDefault();
        const inputs =
          document.querySelectorAll("#signup input");
        const name = inputs[0].value.trim();
        const email = inputs[1].value.trim();
        const password = inputs[2].value;
        try {
          /* CREATE FIREBASE ACCOUNT */
          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );
          const user = userCredential.user;
          /* SAVE NAME TO FIREBASE AUTH PROFILE */
          await updateProfile(user, {
            displayName: name
          });
          /* SAVE PROFILE TO FIRESTORE */
         await setDoc(
  doc(db, "users", user.uid),
  {
    name: name,
    email: email,
    bio: "",
    createdAt: serverTimestamp()
  }
);

await setDoc(
  doc(db, "publicProfiles", user.uid),
  {
    uid: user.uid,
    name: name,
    bio: "",
    createdAt: serverTimestamp()
  }
);
          alert(
            "Account created successfully! Welcome, " +
            name +
            "."
          );
          window.location.href =
            "dashboard.html";
        } catch (error) {
          alert(
            "Sign up failed: " +
            error.message
          );
        }
      });
  </script>
</body>
</html>
