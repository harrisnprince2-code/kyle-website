<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kyle | Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(75, 5, 30, 0.4),
          transparent 40%
        ),
        #030303;
    }
    .login-container {
      width: 90%;
      max-width: 430px;
      padding: 45px 38px;
      background:
        linear-gradient(
          145deg,
          rgba(65, 5, 27, 0.3),
          rgba(8, 8, 8, 0.9)
        );
      border: 1px solid rgba(120, 20, 55, 0.45);
      border-radius: 20px;
      box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.7),
        inset 0 0 50px rgba(70, 5, 30, 0.08);
      backdrop-filter: blur(20px);
    }
    .logo {
      text-align: center;
      margin-bottom: 35px;
    }
    .logo h1 {
      font-size: 28px;
      letter-spacing: 8px;
      margin-bottom: 8px;
    }
    .logo p {
      color: #7e7e7e;
      font-size: 12px;
      letter-spacing: 2px;
    }
    .tabs {
      display: flex;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .tabs button {
      flex: 1;
      padding: 14px;
      border: none;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 2px solid transparent;
    }
    .tabs button.active {
      color: #a32650;
      border-bottom-color: #7d1639;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #a0a0a0;
      font-size: 12px;
    }
    .form-group input {
      width: 100%;
      padding: 15px;
      color: white;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(120,20,55,0.35);
      border-radius: 5px;
      outline: none;
      font-size: 14px;
    }
    .form-group input:focus {
      border-color: #8e1d43;
      box-shadow: 0 0 20px rgba(100,10,45,0.15);
    }
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 5px 0 25px;
      font-size: 12px;
    }
    .remember {
      display: flex;
      gap: 7px;
      align-items: center;
      color: #777;
    }
    .remember input {
      accent-color: #7d1639;
    }
    .forgot {
      color: #96254c;
      text-decoration: none;
    }
    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 5px;
      color: white;
      background:
        linear-gradient(
          135deg,
          #43091e,
          #7d1639
        );
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      background:
        linear-gradient(
          135deg,
          #5a0c28,
          #941e49
        );
    }
    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 15px;
      margin: 25px 0;
      color: #555;
      font-size: 11px;
    }
    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: rgba(255,255,255,0.08);
    }
    .social-login {
      display: flex;
      gap: 10px;
    }
    .social-login button {
      flex: 1;
      padding: 13px;
      color: #aaa;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 5px;
      cursor: pointer;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 25px;
      color: #666;
      text-decoration: none;
      font-size: 12px;
    }
    .back:hover {
      color: #9d2850;
    }
    #signup {
      display: none;
    }
    .error-message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 6px;
      background: rgba(150, 20, 50, 0.15);
      border: 1px solid rgba(150, 20, 50, 0.35);
      color: #e68a9e;
      font-size: 12px;
      text-align: center;
    }
    @media (max-width: 500px) {
      .login-container {
        padding: 35px 25px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
<div class="logo">
  <h1>KYLE</h1>
  <p>OFFICIAL WEBSITE</p>
</div>
<div class="tabs">
  <button id="loginTab" class="active" onclick="showLogin()">
    Login
  </button>
  <button id="signupTab" onclick="showSignup()">
    Sign Up
  </button>
</div>
<div id="errorMessage" class="error-message"></div>
<!-- LOGIN -->
<form id="login">
  <div class="form-group">
    <label>Email Address</label>
    <input
      type="email"
      id="loginEmail"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >
  </div>
  <div class="form-group">
    <label>Password</label>
    <input
      type="password"
      id="loginPassword"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >
  </div>
  <div class="options">
    <label class="remember">
      <input type="checkbox" id="rememberMe">
      Remember me
    </label>
    <a href="#" class="forgot" onclick="return false;">
      Forgot password?
    </a>
  </div>
  <button
    type="submit"
    class="submit-btn"
    id="loginButton"
  >
    LOGIN
  </button>
</form>
<!-- SIGN UP -->
<form id="signup">
  <div class="form-group">
    <label>Full Name</label>
    <input
      type="text"
      id="signupName"
      placeholder="Enter your name"
      required
    >
  </div>
  <div class="form-group">
    <label>Email Address</label>
    <input
      type="email"
      id="signupEmail"
      placeholder="Enter your email"
      required
    >
  </div>
  <div class="form-group">
    <label>Create Password</label>
    <input
      type="password"
      id="signupPassword"
      placeholder="Create a password"
      minlength="6"
      required
    >
  </div>
  <button
    type="submit"
    class="submit-btn"
    id="signupButton"
  >
    CREATE ACCOUNT
  </button>
</form>
<div class="divider">
  OR CONTINUE WITH
</div>
<div class="social-login">
  <button type="button">Google</button>
  <button type="button">Apple</button>
</div>
<a href="index.html" class="back">
  ← Back to website
</a>
  </div>
  <!-- FIREBASE -->
  <script type="module">
    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      updateProfile,
      setPersistence,
      browserLocalPersistence
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      setDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
    /* FIREBASE CONFIG */
    const firebaseConfig = {
      apiKey:
        "AIzaSyATyGLNPuSu3GMxWjFBijyk2mu57GkVZo4",
      authDomain:
        "kyle-official-website.firebaseapp.com",
      projectId:
        "kyle-official-website",
      storageBucket:
        "kyle-official-website.firebasestorage.app",
      messagingSenderId:
        "547868923755",
      appId:
        "1:547868923755:web:a85ffecce9bf9cc6ff5e2e",
      measurementId:
        "G-799CW529X9"
    };
    /* INITIALIZE FIREBASE */
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    /* KEEP USER LOGGED IN */
    await setPersistence(
      auth,
      browserLocalPersistence
    );
    /* ERROR MESSAGE */
    function showError(message) {
      const box =
        document.getElementById("errorMessage");
      box.textContent = message;
      box.style.display = "block";
    }
    function clearError() {
      const box =
        document.getElementById("errorMessage");
      box.textContent = "";
      box.style.display = "none";
    }
    /* LOGIN / SIGNUP TABS */
    window.showLogin = function() {
      clearError();
      document.getElementById("login").style.display =
        "block";
      document.getElementById("signup").style.display =
        "none";
      document.getElementById("loginTab").classList.add(
        "active"
      );
      document.getElementById("signupTab").classList.remove(
        "active"
      );
    };
    window.showSignup = function() {
      clearError();
      document.getElementById("login").style.display =
        "none";
      document.getElementById("signup").style.display =
        "block";
      document.getElementById("loginTab").classList.remove(
        "active"
      );
      document.getElementById("signupTab").classList.add(
        "active"
      );
    };
    /* LOGIN */
    document
      .getElementById("login")
      .addEventListener("submit", async function(event) {
        event.preventDefault();
        clearError();
        const email =
          document
            .getElementById("loginEmail")
            .value
            .trim();
        const password =
          document
            .getElementById("loginPassword")
            .value;
        const loginButton =
          document.getElementById("loginButton");
        loginButton.disabled = true;
        loginButton.textContent =
          "LOGGING IN...";
        try {
          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );
          /*
            Login successful.
            Firebase has now stored the
            authenticated session locally.
          */
          loginButton.textContent =
            "SUCCESS ✓";
          /*
            Small delay allows Firebase
            to finish updating the session
            before changing pages.
          */
          setTimeout(function() {
            window.location.replace(
              "dashboard.html"
            );
          }, 300);
        } catch (error) {
          console.error("Firebase login error:", error);
          let message =
            "Login failed. Please check your email and password.";
          if (
            error.code ===
            "auth/invalid-credential"
          ) {
            message =
              "Incorrect email or password.";
          }
          if (
            error.code ===
            "auth/user-not-found"
          ) {
            message =
              "No account was found with this email.";
          }
          if (
            error.code ===
            "auth/wrong-password"
          ) {
            message =
              "Incorrect password.";
          }
          if (
            error.code ===
            "auth/invalid-email"
          ) {
            message =
              "Please enter a valid email address.";
          }
          if (
            error.code ===
            "auth/too-many-requests"
          ) {
            message =
              "Too many attempts. Please wait and try again.";
          }
          showError(message);
          loginButton.disabled = false;
          loginButton.textContent =
            "LOGIN";
        }
      });
    /* SIGN UP */
    document
      .getElementById("signup")
      .addEventListener("submit", async function(event) {
        event.preventDefault();
        clearError();
        const name =
          document
            .getElementById("signupName")
            .value
            .trim();
        const email =
          document
            .getElementById("signupEmail")
            .value
            .trim();
        const password =
          document
            .getElementById("signupPassword")
            .value;
        const signupButton =
          document.getElementById("signupButton");
        signupButton.disabled = true;
        signupButton.textContent =
          "CREATING ACCOUNT...";
        try {
          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );
          const user =
            userCredential.user;
          await updateProfile(
            user,
            {
              displayName: name
            }
          );
          await setDoc(
            doc(db, "users", user.uid),
            {
              name: name,
              email: email,
              bio: "",
              createdAt: serverTimestamp()
            }
          );
          await setDoc(
            doc(db, "publicProfiles", user.uid),
            {
              uid: user.uid,
              name: name,
              bio: "",
              createdAt: serverTimestamp()
            }
          );
          alert(
            "Account created successfully! Welcome, " +
            name +
            "."
          );
          window.location.replace(
            "dashboard.html"
          );
        } catch (error) {
          console.error(
            "Firebase signup error:",
            error
          );
          showError(
            "Sign up failed: " +
            error.message
          );
          signupButton.disabled = false;
          signupButton.textContent =
            "CREATE ACCOUNT";
        }
      });
  </script>
</body>
</html>
