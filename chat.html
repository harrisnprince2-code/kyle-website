<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kyle Fuller | Fan Chat</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  background: #050505;
  color: #fff;
}
button,
input {
  font-family: inherit;
}
/* =========================
   APP
========================= */
.chat-app {
  width: 100%;
  height: 100dvh;
  min-height: 100%;
  display: flex;
  overflow: hidden;
  background: #050505;
}
/* =========================
   LEFT PANEL
========================= */
.sidebar {
  width: 330px;
  height: 100%;
  background: #0b0b0b;
  border-right: 1px solid #241216;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  min-height: 0;
}
.sidebar-top {
  padding: 22px;
  border-bottom: 1px solid #241216;
  flex-shrink: 0;
}
.brand {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  margin-bottom: 20px;
}
.brand span {
  color: #8b3949;
}
.current-user {
  display: flex;
  align-items: center;
  gap: 12px;
}
.avatar {
  width: 46px;
  height: 46px;
  min-width: 46px;
  border-radius: 50%;
  background: #8b3949;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #fff;
  font-weight: 700;
}
.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.chat-user-name {
  font-size: 15px;
  font-weight: 700;
  margin-bottom: 4px;
}
.chat-user-status {
  color: #888;
  font-size: 12px;
}
/* =========================
   TABS
========================= */
.sidebar-tabs {
  display: flex;
  gap: 5px;
  padding: 8px;
  background: #090909;
  border-bottom: 1px solid #241216;
  flex-shrink: 0;
}
.side-tab {
  flex: 1;
  min-width: 0;
  padding: 11px 5px;
  border: 1px solid #222;
  border-radius: 8px;
  background: #111;
  color: #888;
  cursor: pointer;
  font-weight: 800;
  font-size: 11px;
}
.side-tab.active {
  background: #6f2d3b;
  border-color: #8b3949;
  color: #fff;
}
/* =========================
   MAIN AREA
========================= */
.main-area {
  flex: 1;
  min-width: 0;
  min-height: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: #050505;
}
/* =========================
   HEADER
========================= */
.chat-header {
  height: 78px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 22px;
  background: #090909;
  border-bottom: 1px solid #241216;
}
.chat-header-title {
  font-size: 16px;
  font-weight: 800;
}
.chat-status {
  color: #777;
  font-size: 12px;
  margin-top: 4px;
}
.back-btn {
  display: none;
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 22px;
  cursor: pointer;
  padding: 5px;
}
/* =========================
   ONE CONTENT AREA
========================= */
.content-panel {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
}
/* Every view occupies the exact same space */
.app-view {
  display: none;
  width: 100%;
  height: 100%;
  min-height: 0;
}
.app-view.active {
  display: flex;
}
/* =========================
   LIST VIEWS
========================= */
.list-view {
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.list-title {
  padding: 18px 20px 12px;
  color: #aaa;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
}
.member-card,
.inbox-card {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-bottom: 1px solid #181818;
  cursor: pointer;
  background: transparent;
  color: #fff;
  text-align: left;
}
.member-card:hover,
.inbox-card:hover {
  background: #111;
}
.member-info,
.inbox-info {
  min-width: 0;
  flex: 1;
}
.member-name,
.inbox-name {
  font-size: 14px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.member-email,
.inbox-last {
  color: #888;
  font-size: 12px;
  margin-top: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.open-btn {
  flex-shrink: 0;
  border: 0;
  border-radius: 7px;
  background: #8b3949;
  color: #fff;
  padding: 8px 11px;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
}
.empty-side {
  color: #777;
  text-align: center;
  padding: 40px 20px;
  font-size: 13px;
}
/* =========================
   CHAT VIEWS
========================= */
.chat-view {
  flex-direction: column;
  min-height: 0;
  overflow: hidden;
}
.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 22px;
}
.message-wrapper {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 18px;
}
.message-wrapper.mine {
  flex-direction: row-reverse;
}
.message-avatar {
  width: 36px;
  height: 36px;
  min-width: 36px;
  border-radius: 50%;
  background: #8b3949;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  font-size: 12px;
  font-weight: 700;
}
.message-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.message-content {
  max-width: min(70%, 600px);
  min-width: 0;
}
.message-wrapper.mine .message-content {
  text-align: right;
}
.sender-name {
  color: #999;
  font-size: 11px;
  margin-bottom: 5px;
}
.message-bubble {
  display: inline-block;
  max-width: 100%;
  padding: 11px 14px;
  border-radius: 14px;
  background: #171717;
  border: 1px solid #252525;
  color: #fff;
  font-size: 14px;
  line-height: 1.45;
  text-align: left;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.message-wrapper.mine .message-bubble {
  background: #6f2d3b;
  border-color: #8b3949;
}
.message-time {
  color: #666;
  font-size: 10px;
  margin-top: 5px;
}
.empty-chat {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #666;
  text-align: center;
  padding: 30px;
  line-height: 1.6;
}
/* =========================
   COMPOSER
========================= */
.composer {
  flex-shrink: 0;
  padding: 12px 18px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  background: #090909;
  border-top: 1px solid #241216;
}
.composer-form {
  display: flex;
  gap: 10px;
  width: 100%;
}
.composer-input {
  flex: 1;
  min-width: 0;
  height: 46px;
  padding: 0 15px;
  border-radius: 12px;
  border: 1px solid #292929;
  outline: none;
  background: #111;
  color: #fff;
  font-size: 16px;
}
.composer-input::placeholder {
  color: #666;
}
.composer-input:focus {
  border-color: #8b3949;
}
.send-btn {
  height: 46px;
  flex-shrink: 0;
  padding: 0 19px;
  border: 0;
  border-radius: 12px;
  background: #8b3949;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}
.send-btn:disabled {
  opacity: .5;
}
/* =========================
   MOBILE
========================= */
@media (max-width: 800px) {
  .chat-app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  .sidebar {
    width: 100%;
    height: auto;
    flex-shrink: 0;
    border-right: 0;
    border-bottom: 1px solid #241216;
  }
  .sidebar-top {
    padding: 10px 15px;
  }
  .brand {
    display: none;
  }
  .current-user {
    justify-content: flex-start;
  }
  .sidebar-tabs {
    padding: 7px;
  }
  .side-tab {
    padding: 11px 3px;
    font-size: 10px;
  }
  .main-area {
    width: 100%;
    flex: 1;
    min-height: 0;
  }
  .chat-header {
    height: 62px;
    padding: 0 12px;
  }
  .chat-header-title {
    font-size: 15px;
  }
  .back-btn {
    display: none;
  }
  .messages {
    padding: 15px 12px;
  }
  .message-content {
    max-width: 82%;
  }
  .message-bubble {
    font-size: 13px;
  }
  .member-card,
  .inbox-card {
    padding: 13px 14px;
  }
  .composer {
    padding: 8px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
  }
  .composer-form {
    gap: 7px;
  }
  .composer-input {
    height: 44px;
    font-size: 16px;
    padding: 0 12px;
  }
  .send-btn {
    height: 44px;
    padding: 0 14px;
    font-size: 11px;
  }
}
@media (max-width: 480px) {
  .avatar {
    width: 42px;
    height: 42px;
    min-width: 42px;
  }
  .sidebar-tabs {
    gap: 5px;
    padding: 6px;
  }
  .side-tab {
    padding: 10px 2px;
    font-size: 9px;
  }
  .chat-header {
    height: 58px;
  }
  .messages {
    padding: 12px 10px;
  }
  .message-avatar {
    width: 32px;
    height: 32px;
    min-width: 32px;
  }
  .message-content {
    max-width: 80%;
  }
  .message-bubble {
    padding: 9px 11px;
    font-size: 12px;
  }
  .composer {
    padding: 7px;
    padding-bottom: calc(7px + env(safe-area-inset-bottom));
  }
  .send-btn {
    padding: 0 12px;
  }
}
</style>
</head>
<body>
<div class="chat-app">
  <!-- =========================
       LEFT / TOP NAVIGATION
  ========================== -->
  <aside class="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        KYLE <span>FULLER</span>
      </div>
      <div class="current-user">
        <div class="avatar" id="sidebarAvatar">
          <span>?</span>
        </div>
        <div>
          <div class="chat-user-name" id="sidebarName">
            Loading...
          </div>
          <div class="chat-user-status" id="sidebarStatus">
            Live fan community
          </div>
        </div>
      </div>
    </div>
    <!-- TABS -->
    <div class="sidebar-tabs">
      <button
        type="button"
        class="side-tab active"
        data-tab="community"
      >
        COMMUNITY
      </button>
      <button
        type="button"
        class="side-tab"
        data-tab="members"
      >
        MEMBERS
      </button>
      <button
        type="button"
        class="side-tab"
        data-tab="inbox"
      >
        INBOX
      </button>
    </div>
  </aside>
  <!-- =========================
       ONE MAIN CONTENT AREA
  ========================== -->
  <main class="main-area">
    <!-- HEADER -->
    <header class="chat-header">
      <button
        type="button"
        class="back-btn"
        id="backButton"
      >
        ←
      </button>
      <div
        class="avatar"
        id="headerAvatar"
      >
        <span>KF</span>
      </div>
      <div>
        <div
          class="chat-header-title"
          id="chatTitle"
        >
          Kyle Fuller Community
        </div>
        <div
          class="chat-status"
          id="chatStatus"
        >
          Live fan discussion
        </div>
      </div>
    </header>
    <!-- =========================
         SHARED CONTENT PANEL
    ========================== -->
    <div class="content-panel">
      <!-- COMMUNITY -->
      <section
        class="app-view chat-view active"
        id="communityView"
      >
        <div
          class="messages"
          id="communityMessages"
        >
          <div class="empty-chat">
            Loading community...
          </div>
        </div>
      </section>
      <!-- MEMBERS -->
      <section
        class="app-view list-view"
        id="membersView"
      >
        <div class="list-title">
          Fan Members
        </div>
        <div id="membersList">
          <div class="empty-side">
            Loading members...
          </div>
        </div>
      </section>
      <!-- INBOX -->
      <section
        class="app-view list-view"
        id="inboxView"
      >
        <div class="list-title">
          Private Messages
        </div>
        <div id="inboxList">
          <div class="empty-side">
            Loading inbox...
          </div>
        </div>
      </section>
      <!-- PRIVATE CHAT -->
      <section
        class="app-view chat-view"
        id="privateView"
      >
        <div
          class="messages"
          id="privateMessages"
        >
          <div class="empty-chat">
            Loading conversation...
          </div>
        </div>
      </section>
    </div>
    <!-- =========================
         COMPOSER
    ========================== -->
    <div
      class="composer"
      id="composer"
    >
      <form
        class="composer-form"
        id="messageForm"
      >
        <input
          class="composer-input"
          id="messageInput"
          type="text"
          placeholder="Write a message..."
          autocomplete="off"
          enterkeyhint="send"
        >
        <button
          class="send-btn"
          id="sendButton"
          type="submit"
        >
          SEND
        </button>
      </form>
    </div>
  </main>
</div>
<script type="module">
/* =========================
   FIREBASE
========================= */
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {
  getFirestore,
  collection,
  doc,
  getDoc,
  addDoc,
  setDoc,
  onSnapshot,
  query,
  orderBy,
  where,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey:
    "AIzaSyATyGLNPuSu3GMxWjFBijyk2mu57GkVZo4",
  authDomain:
    "kyle-official-website.firebaseapp.com",
  projectId:
    "kyle-official-website",
  storageBucket:
    "kyle-official-website.firebasestorage.app",
  messagingSenderId:
    "547868923755",
  appId:
    "1:547868923755:web:a85ffecce9bf9cc6ff5e2e",
  measurementId:
    "G-799CW529X9"
};
const app =
  initializeApp(firebaseConfig);
const auth =
  getAuth(app);
const db =
  getFirestore(app);
/* =========================
   ELEMENTS
========================= */
const sidebarName =
  document.getElementById("sidebarName");
const sidebarAvatar =
  document.getElementById("sidebarAvatar");
const sidebarStatus =
  document.getElementById("sidebarStatus");
const headerAvatar =
  document.getElementById("headerAvatar");
const chatTitle =
  document.getElementById("chatTitle");
const chatStatus =
  document.getElementById("chatStatus");
const composer =
  document.getElementById("composer");
const messageForm =
  document.getElementById("messageForm");
const messageInput =
  document.getElementById("messageInput");
const sendButton =
  document.getElementById("sendButton");
const backButton =
  document.getElementById("backButton");
const communityView =
  document.getElementById("communityView");
const membersView =
  document.getElementById("membersView");
const inboxView =
  document.getElementById("inboxView");
const privateView =
  document.getElementById("privateView");
const communityMessages =
  document.getElementById("communityMessages");
const privateMessages =
  document.getElementById("privateMessages");
const membersList =
  document.getElementById("membersList");
const inboxList =
  document.getElementById("inboxList");
/* =========================
   STATE
========================= */
let currentUser = null;
let currentUserProfile = {};
let currentPrivateUser = null;
let currentView = "community";
let previousListView = "members";
let unsubscribeCommunity = null;
let unsubscribeMembers = null;
let unsubscribeInbox = null;
let unsubscribePrivate = null;
/* =========================
   URL
========================= */
const urlParams =
  new URLSearchParams(
    window.location.search
  );
const privateUid =
  urlParams.get("with");
/* =========================
   HELPERS
========================= */
function escapeHTML(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}
function getInitials(name) {
  if (!name) {
    return "?";
  }
  const words =
    String(name)
      .trim()
      .split(/\s+/);
  if (words.length === 1) {
    return words[0]
      .substring(0, 2)
      .toUpperCase();
  }
  return (
    words[0][0] +
    words[words.length - 1][0]
  ).toUpperCase();
}
function formatTime(timestamp) {
  if (!timestamp) {
    return "";
  }
  const date =
    timestamp.toDate
      ? timestamp.toDate()
      : new Date(timestamp);
  if (isNaN(date.getTime())) {
    return "";
  }
  return date.toLocaleTimeString(
    [],
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );
}
function avatarHTML(profile, name) {
  const initials =
    getInitials(name);
  const image =
    profile?.profileImage;
  if (image) {
    return `
      <div class="avatar">
        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(name || "Profile")}"
        >
      </div>
    `;
  }
  return `
    <div class="avatar">
      ${escapeHTML(initials)}
    </div>
  `;
}
function messageAvatarHTML(profile, name) {
  const initials =
    getInitials(name);
  const image =
    profile?.profileImage;
  if (image) {
    return `
      <div class="message-avatar">
        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(name || "Profile")}"
        >
      </div>
    `;
  }
  return `
    <div class="message-avatar">
      ${escapeHTML(initials)}
    </div>
  `;
}
/* =========================
   STOP LISTENERS
========================= */
function stopCommunityListener() {
  if (unsubscribeCommunity) {
    unsubscribeCommunity();
    unsubscribeCommunity = null;
  }
}
function stopMembersListener() {
  if (unsubscribeMembers) {
    unsubscribeMembers();
    unsubscribeMembers = null;
  }
}
function stopInboxListener() {
  if (unsubscribeInbox) {
    unsubscribeInbox();
    unsubscribeInbox = null;
  }
}
function stopPrivateListener() {
  if (unsubscribePrivate) {
    unsubscribePrivate();
    unsubscribePrivate = null;
  }
}
/* =========================
   VIEW SYSTEM
========================= */
function showView(viewName) {
  currentView = viewName;
  communityView.classList.remove("active");
  membersView.classList.remove("active");
  inboxView.classList.remove("active");
  privateView.classList.remove("active");
  document
    .querySelectorAll(".side-tab")
    .forEach(tab => {
      tab.classList.remove("active");
    });
  composer.style.display = "none";
  backButton.style.display = "none";
  if (viewName === "community") {
    communityView.classList.add("active");
    document
      .querySelector('[data-tab="community"]')
      .classList.add("active");
    chatTitle.textContent =
      "Kyle Fuller Community";
    chatStatus.textContent =
      "Live fan discussion";
    sidebarStatus.textContent =
      "Live fan discussion";
    headerAvatar.innerHTML =
      `<span>KF</span>`;
    composer.style.display =
      "block";
    openCommunityListener();
  }
  if (viewName === "members") {
    membersView.classList.add("active");
    document
      .querySelector('[data-tab="members"]')
      .classList.add("active");
    chatTitle.textContent =
      "Fan Members";
    chatStatus.textContent =
      "Members of the community";
    sidebarStatus.textContent =
      "Fan members";
    headerAvatar.innerHTML =
      `<span>👥</span>`;
    loadMembers();
  }
  if (viewName === "inbox") {
    inboxView.classList.add("active");
    document
      .querySelector('[data-tab="inbox"]')
      .classList.add("active");
    chatTitle.textContent =
      "Inbox";
    chatStatus.textContent =
      "Private conversations";
    sidebarStatus.textContent =
      "Private messages";
    headerAvatar.innerHTML =
      `<span>✉</span>`;
    loadInbox();
  }
  if (viewName === "private") {
    privateView.classList.add("active");
    backButton.style.display =
      "block";
    composer.style.display =
      "block";
    openPrivateChat(
      currentPrivateUser?.uid
    );
  }
}
/* =========================
   TABS
========================= */
document
  .querySelectorAll(".side-tab")
  .forEach(button => {
    button.addEventListener(
      "click",
      event => {
        event.preventDefault();
        const tab =
          button.dataset.tab;
        if (tab === "community") {
          showView("community");
        }
        if (tab === "members") {
          showView("members");
        }
        if (tab === "inbox") {
          showView("inbox");
        }
      }
    );
  });
/* =========================
   BACK BUTTON
========================= */
backButton.addEventListener(
  "click",
  () => {
    stopPrivateListener();
    currentPrivateUser = null;
    showView(
      previousListView || "members"
    );
  }
);
/* =========================
   CURRENT USER
========================= */
async function loadCurrentUser() {
  if (!currentUser) {
    return;
  }
  const fallbackName =
    currentUser.displayName ||
    currentUser.email?.split("@")[0] ||
    "Fan";
  sidebarName.textContent =
    fallbackName;
  sidebarAvatar.innerHTML =
    `<span>${escapeHTML(
      getInitials(fallbackName)
    )}</span>`;
  try {
    const userDoc =
      await getDoc(
        doc(
          db,
          "users",
          currentUser.uid
        )
      );
    if (userDoc.exists()) {
      currentUserProfile =
        userDoc.data();
      const profileName =
        currentUserProfile.name ||
        fallbackName;
      sidebarName.textContent =
        profileName;
      if (
        currentUserProfile.profileImage
      ) {
        sidebarAvatar.innerHTML =
          `<img
            src="${escapeHTML(
              currentUserProfile.profileImage
            )}"
            alt="Profile"
          >`;
      } else {
        sidebarAvatar.innerHTML =
          `<span>${escapeHTML(
            getInitials(profileName)
          )}</span>`;
      }
    }
  } catch (error) {
    console.error(
      "Profile loading error:",
      error
    );
  }
}
/* =========================
   COMMUNITY
========================= */
function openCommunityListener() {
  stopPrivateListener();
  if (unsubscribeCommunity) {
    return;
  }
  communityMessages.innerHTML = `
    <div class="empty-chat">
      Loading messages...
    </div>
  `;
  const messagesQuery =
    query(
      collection(
        db,
        "messages"
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );
  unsubscribeCommunity =
    onSnapshot(
      messagesQuery,
      async snapshot => {
        communityMessages.innerHTML = "";
        if (snapshot.empty) {
          communityMessages.innerHTML = `
            <div class="empty-chat">
              No messages yet.<br>
              Be the first fan to say hello!
            </div>
          `;
          return;
        }
        for (
          const messageDoc
          of snapshot.docs
        ) {
          const data =
            messageDoc.data();
          let profile = {};
          try {
            if (data.senderId) {
              const userDoc =
                await getDoc(
                  doc(
                    db,
                    "users",
                    data.senderId
                  )
                );
              if (userDoc.exists()) {
                profile =
                  userDoc.data();
              }
            }
          } catch (error) {
            console.error(
              "Profile error:",
              error
            );
          }
          const senderName =
            data.senderName ||
            profile.name ||
            "Fan";
          const wrapper =
            document.createElement(
              "div"
            );
          wrapper.className =
            "message-wrapper" +
            (
              data.senderId ===
              currentUser.uid
                ? " mine"
                : ""
            );
          wrapper.innerHTML = `
            ${messageAvatarHTML(
              profile,
              senderName
            )}
            <div class="message-content">
              <div class="sender-name">
                ${escapeHTML(senderName)}
              </div>
              <div class="message-bubble">
                ${escapeHTML(
                  data.text || ""
                )}
              </div>
              <div class="message-time">
                ${formatTime(
                  data.createdAt
                )}
              </div>
            </div>
          `;
          communityMessages.appendChild(
            wrapper
          );
        }
        communityMessages.scrollTop =
          communityMessages.scrollHeight;
      },
      error => {
        console.error(
          "Community error:",
          error
        );
        communityMessages.innerHTML = `
          <div class="empty-chat">
            Unable to load community chat.
          </div>
        `;
      }
    );
}
/* =========================
   MEMBERS
========================= */
function loadMembers() {
  stopMembersListener();
  membersList.innerHTML = `
    <div class="empty-side">
      Loading members...
    </div>
  `;
  const usersQuery =
    query(
      collection(
        db,
        "users"
      )
    );
  unsubscribeMembers =
    onSnapshot(
      usersQuery,
      snapshot => {
        membersList.innerHTML = "";
        const users =
          snapshot.docs
            .map(item => ({
              id: item.id,
              ...item.data()
            }))
            .filter(
              user =>
                user.id !==
                currentUser.uid
            );
        if (users.length === 0) {
          membersList.innerHTML = `
            <div class="empty-side">
              No other members yet.
            </div>
          `;
          return;
        }
        users.forEach(user => {
          const name =
            user.name ||
            user.displayName ||
            user.email?.split("@")[0] ||
            "Fan";
          const card =
            document.createElement(
              "div"
            );
          card.className =
            "member-card";
          card.innerHTML = `
            ${avatarHTML(
              user,
              name
            )}
            <div class="member-info">
              <div class="member-name">
                ${escapeHTML(name)}
              </div>
              <div class="member-email">
                Fan member
              </div>
            </div>
            <button
              class="open-btn"
              type="button"
            >
              MESSAGE
            </button>
          `;
          card.addEventListener(
            "click",
            () => {
              previousListView =
                "members";
              currentPrivateUser = {
                uid: user.id,
                ...user
              };
              showPrivateUser(
                currentPrivateUser
              );
            }
          );
          membersList.appendChild(
            card
          );
        });
      },
      error => {
        console.error(
          "Members error:",
          error
        );
        membersList.innerHTML = `
          <div class="empty-side">
            Unable to load members.
          </div>
        `;
      }
    );
}
/* =========================
   OPEN PRIVATE USER
========================= */
async function showPrivateUser(user) {
  currentview = "private";
  currentPrivateUser =
    user;
  privateView.classList.add(
    "active"
  );
  communityView.classList.remove(
    "active"
  );
  membersView.classList.remove(
    "active"
  );
  inboxView.classList.remove(
    "active"
  );
  document
    .querySelectorAll(".side-tab")
    .forEach(tab => {
      tab.classList.remove("active");
    });
  backButton.style.display =
    "block";
  composer.style.display =
    "block";
  const name =
    user.name ||
    user.displayName ||
    user.email?.split("@")[0] ||
    "Fan";
  chatTitle.textContent =
    name;
  chatStatus.textContent =
    "Private conversation";
  sidebarStatus.textContent =
    "Private conversation";
  headerAvatar.innerHTML =
    user.profileImage
      ? `<img
          src="${escapeHTML(
            user.profileImage
          )}"
          alt="${escapeHTML(name)}"
        >`
      : `<span>${escapeHTML(
          getInitials(name)
        )}</span>`;
  await openPrivateChat(
    user.uid
  );
}
/* =========================
   PRIVATE CHAT
========================= */
async function openPrivateChat(uid) {
  if (!uid || !currentUser) {
    return;
  }
  stopPrivateListener();
  const userDoc =
    await getDoc(
      doc(
        db,
        "users",
        uid
      )
    );
  if (!userDoc.exists()) {
    privateMessages.innerHTML = `
      <div class="empty-chat">
        Member not found.
      </div>
    `;
    return;
  }
  const otherUser =
    userDoc.data();
  currentPrivateUser = {
    uid,
    ...otherUser
  };
  const otherName =
    otherUser.name ||
    otherUser.displayName ||
    "Fan";
  chatTitle.textContent =
    otherName;
  chatStatus.textContent =
    "Private conversation";
  headerAvatar.innerHTML =
    otherUser.profileImage
      ? `<img
          src="${escapeHTML(
            otherUser.profileImage
          )}"
          alt="${escapeHTML(otherName)}"
        >`
      : `<span>${escapeHTML(
          getInitials(otherName)
        )}</span>`;
  const conversationId =
    [
      currentUser.uid,
      uid
    ]
      .sort()
      .join("_");
  const conversationRef =
    doc(
      db,
      "conversations",
      conversationId
    );
  const conversationSnap =
    await getDoc(
      conversationRef
    );
  if (!conversationSnap.exists()) {
    await setDoc(
      conversationRef,
      {
        participants: [
          currentUser.uid,
          uid
        ],
        createdAt:
          serverTimestamp(),
        updatedAt:
          serverTimestamp(),
        lastMessage: ""
      }
    );
  }
  privateMessages.innerHTML = `
    <div class="empty-chat">
      Loading conversation...
    </div>
  `;
  const privateQuery =
    query(
      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),
      orderBy(
        "createdAt",
        "asc"
      )
    );
  unsubscribePrivate =
    onSnapshot(
      privateQuery,
      async snapshot => {
        privateMessages.innerHTML = "";
        if (snapshot.empty) {
          privateMessages.innerHTML = `
            <div class="empty-chat">
              Start your private conversation with
              ${escapeHTML(otherName)}.
            </div>
          `;
          return;
        }
        for (
          const messageDoc
          of snapshot.docs
        ) {
          const data =
            messageDoc.data();
          let profile = {};
          try {
            if (data.senderId) {
              const senderDoc =
                await getDoc(
                  doc(
                    db,
                    "users",
                    data.senderId
                  )
                );
              if (senderDoc.exists()) {
                profile =
                  senderDoc.data();
              }
            }
          } catch (error) {
            console.error(
              "Private profile error:",
              error
            );
          }
          const senderName =
            data.senderName ||
            profile.name ||
            (
              data.senderId ===
              currentUser.uid
                ? "You"
                : otherName
            );
          const wrapper =
            document.createElement(
              "div"
            );
          wrapper.className =
            "message-wrapper" +
            (
              data.senderId ===
              currentUser.uid
                ? " mine"
                : ""
            );
          wrapper.innerHTML = `
            ${messageAvatarHTML(
              profile,
              senderName
            )}
            <div class="message-content">
              <div class="sender-name">
                ${escapeHTML(senderName)}
              </div>
              <div class="message-bubble">
                ${escapeHTML(
                  data.text || ""
                )}
              </div>
              <div class="message-time">
                ${formatTime(
                  data.createdAt
                )}
              </div>
            </div>
          `;
          privateMessages.appendChild(
            wrapper
          );
        }
        privateMessages.scrollTop =
          privateMessages.scrollHeight;
      },
      error => {
        console.error(
          "Private chat error:",
          error
        );
        privateMessages.innerHTML = `
          <div class="empty-chat">
            Unable to load conversation.
          </div>
        `;
      }
    );
}
/* =========================
   INBOX
========================= */
function loadInbox() {
  stopInboxListener();
  inboxList.innerHTML = `
    <div class="empty-side">
      Loading inbox...
    </div>
  `;
  const inboxQuery =
    query(
      collection(
        db,
        "conversations"
      ),
      where(
        "participants",
        "array-contains",
        currentUser.uid
      )
    );
  unsubscribeInbox =
    onSnapshot(
      inboxQuery,
      async snapshot => {
        inboxList.innerHTML = "";
        if (snapshot.empty) {
          inboxList.innerHTML = `
            <div class="empty-side">
              No private messages yet.
            </div>
          `;
          return;
        }
        const conversations =
          snapshot.docs
            .map(item => ({
              id: item.id,
              ...item.data()
            }))
            .sort(
              (a, b) => {
                const aTime =
                  a.updatedAt?.toMillis?.() ||
                  0;
                const bTime =
                  b.updatedAt?.toMillis?.() ||
                  0;
                return bTime - aTime;
              }
            );
        for (
          const conversation
          of conversations
        ) {
          const otherUid =
            conversation.participants?.find(
              uid =>
                uid !==
                currentUser.uid
            );
          if (!otherUid) {
            continue;
          }
          let otherUser = {};
          try {
            const userDoc =
              await getDoc(
                doc(
                  db,
                  "users",
                  otherUid
                )
              );
            if (userDoc.exists()) {
              otherUser =
                userDoc.data();
            }
          } catch (error) {
            console.error(
              "Inbox profile error:",
              error
            );
          }
          const name =
            otherUser.name ||
            otherUser.displayName ||
            "Fan";
          const card =
            document.createElement(
              "div"
            );
          card.className =
            "inbox-card";
          card.innerHTML = `
            ${avatarHTML(
              otherUser,
              name
            )}
            <div class="inbox-info">
              <div class="inbox-name">
                ${escapeHTML(name)}
              </div>
              <div class="inbox-last">
                ${escapeHTML(
                  conversation.lastMessage ||
                  "Open conversation"
                )}
              </div>
            </div>
            <button
              class="open-btn"
              type="button"
            >
              OPEN
            </button>
          `;
          card.addEventListener(
            "click",
            () => {
              previousListView =
                "inbox";
              currentPrivateUser = {
                uid: otherUid,
                ...otherUser
              };
              showPrivateUser(
                currentPrivateUser
              );
            }
          );
          inboxList.appendChild(
            card
          );
        }
      },
      error => {
        console.error(
          "Inbox error:",
          error
        );
        inboxList.innerHTML = `
          <div class="empty-side">
            Unable to load inbox.
          </div>
        `;
      }
    );
}
/* =========================
   SEND MESSAGE
========================= */
messageForm.addEventListener(
  "submit",
  async event => {
    event.preventDefault();
    const text =
      messageInput.value.trim();
    if (
      !text ||
      !currentUser
    ) {
      return;
    }
    sendButton.disabled =
      true;
    try {
      const senderName =
        currentUserProfile.name ||
        currentUser.displayName ||
        currentUser.email?.split("@")[0] ||
        "Fan";
      /* PRIVATE MESSAGE */
      if (
        currentPrivateUser &&
        currentView === "private"
      ) {
        const conversationId =
          [
            currentUser.uid,
            currentPrivateUser.uid
          ]
            .sort()
            .join("_");
        await addDoc(
          collection(
            db,
            "conversations",
            conversationId,
            "messages"
          ),
          {
            senderId:
              currentUser.uid,
            senderName:
              senderName,
            text:
              text,
            createdAt:
              serverTimestamp()
          }
        );
        await setDoc(
          doc(
            db,
            "conversations",
            conversationId
          ),
          {
            participants: [
              currentUser.uid,
              currentPrivateUser.uid
            ],
            lastMessage:
              text,
            updatedAt:
              serverTimestamp()
          },
          {
            merge: true
          }
        );
      }
      /* COMMUNITY MESSAGE */
      else if (
        currentView === "community"
      ) {
        await addDoc(
          collection(
            db,
            "messages"
          ),
          {
            senderId:
              currentUser.uid,
            senderName:
              senderName,
            text:
              text,
            createdAt:
              serverTimestamp()
          }
        );
      }
      messageInput.value = "";
    } catch (error) {
      console.error(
        "Send message error:",
        error
      );
      alert(
        "Message could not be sent. Please try again."
      );
    } finally {
      sendButton.disabled =
        false;
      messageInput.focus();
    }
  }
);
/* =========================
   AUTH
========================= */
onAuthStateChanged(
  auth,
  async user => {
    console.log(
      "Firebase auth:",
      user
        ? user.uid
        : "NO USER"
    );
    if (!user) {
      window.location.href =
        "login.html";
      return;
    }
    currentUser =
      user;
    await loadCurrentUser();
    /*
      If someone opened:
      chat.html?with=UID
      open that person's private chat.
    */
    if (privateUid) {
      try {
        const userDoc =
          await getDoc(
            doc(
              db,
              "users",
              privateUid
            )
          );
        if (userDoc.exists()) {
          previousListView =
            "members";
          currentPrivateUser = {
            uid: privateUid,
            ...userDoc.data()
          };
          showPrivateUser(
            currentPrivateUser
          );
        } else {
          showView(
            "members"
          );
        }
      } catch (error) {
        console.error(
          error
        );
        showView(
          "members"
        );
      }
    } else {
      showView(
        "community"
      );
    }
  }
);
