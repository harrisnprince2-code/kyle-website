<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kyle | Fan Community</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 80% 0%, rgba(100, 10, 45, 0.25), transparent 30%),
        #030303;
    }

    header {
      height: 78px;
      padding: 0 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 3, 3, 0.95);
      border-bottom: 1px solid rgba(120, 20, 55, 0.35);
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 8px;
    }

    .back {
      color: #a52a50;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
    }

    .chat-container {
      width: 92%;
      max-width: 1000px;
      height: calc(100vh - 120px);
      min-height: 600px;
      margin: 25px auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      overflow: hidden;
      border: 1px solid rgba(120, 20, 55, 0.35);
      border-radius: 20px;
      background: rgba(8, 8, 8, 0.92);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
    }

    .sidebar {
      border-right: 1px solid rgba(120, 20, 55, 0.25);
      background: rgba(20, 3, 10, 0.4);
    }

    .sidebar-title {
      padding: 25px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .sidebar-title p {
      color: #922047;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 7px;
    }

    .sidebar-title h2 {
      font-size: 20px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .tab {
      flex: 1;
      padding: 15px 8px;
      border: none;
      background: transparent;
      color: #777;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      cursor: pointer;
    }

    .tab.active {
      color: white;
      background: rgba(100, 10, 45, 0.18);
      border-bottom: 2px solid #8d1d45;
    }

    .chat-user {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      background: rgba(100, 10, 45, 0.12);
      border-left: 2px solid #8d1d45;
    }

    .avatar {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #4b0925, #12030a);
      border: 1px solid rgba(145, 35, 75, 0.5);
      color: #b1325c;
      font-size: 11px;
      font-weight: bold;
    }

    .chat-user h3 {
      font-size: 14px;
      margin-bottom: 3px;
    }

    .online {
      color: #777;
      font-size: 11px;
    }

    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .chat-header {
      height: 76px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .chat-header h2 {
      font-size: 16px;
    }

    .chat-header p {
      color: #777;
      font-size: 11px;
      margin-top: 3px;
    }

    .messages {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 75%;
    }

    .message-wrapper.received {
      align-self: flex-start;
    }

    .message-wrapper.sent {
      align-self: flex-end;
      align-items: flex-end;
    }

    .sender {
      font-size: 10px;
      color: #8d1d45;
      margin: 0 0 5px 4px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .message {
      padding: 13px 17px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
    }

    .received .message {
      color: #bbb;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
      border-bottom-left-radius: 4px;
    }

    .sent .message {
      background: linear-gradient(135deg, #43091e, #7d1639);
      border-bottom-right-radius: 4px;
    }

    .time {
      display: block;
      margin-top: 5px;
      color: #666;
      font-size: 9px;
    }

    .sent .time {
      color: #c48aa0;
    }

    .empty-chat,
    .loading-members {
      margin: auto;
      color: #666;
      font-size: 13px;
      text-align: center;
    }

    .members {
      flex: 1;
      padding: 25px;
      overflow-y: auto;
      display: none;
    }

    .members.active {
      display: block;
    }

    .members-heading {
      margin-bottom: 20px;
    }

    .members-heading h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .members-heading p {
      color: #777;
      font-size: 12px;
    }

    .member-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px;
      margin-bottom: 10px;
      border: 1px solid rgba(120,20,55,0.2);
      border-radius: 12px;
      background: rgba(255,255,255,0.025);
      transition: 0.2s;
    }

    .member-card:hover {
      background: rgba(100,10,45,0.12);
      border-color: rgba(120,20,55,0.45);
    }

    .member-info {
      flex: 1;
      min-width: 0;
    }

    .member-info h3 {
      font-size: 14px;
      margin-bottom: 4px;
    }

    .member-info p {
      color: #777;
      font-size: 11px;
    }

    .member-status {
      color: #777;
      font-size: 9px;
      margin-top: 5px;
    }

    .member-status::before {
      content: "●";
      color: #8d1d45;
      margin-right: 5px;
    }

    .profile-btn {
      padding: 8px 12px;
      border: 1px solid rgba(140,30,70,0.4);
      border-radius: 6px;
      background: transparent;
      color: #b1325c;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .profile-btn:hover {
      background: #4a0b25;
      color: white;
    }

    .chat-input {
      padding: 18px;
      display: flex;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(3,3,3,0.7);
    }

    .chat-input input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      color: white;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(120,20,55,0.3);
      border-radius: 7px;
      outline: none;
      font-size: 13px;
    }

    .chat-input input:focus {
      border-color: #8e1d43;
    }

    .send {
      padding: 0 22px;
      border: none;
      border-radius: 7px;
      color: white;
      background: linear-gradient(135deg, #43091e, #7d1639);
      font-weight: bold;
      cursor: pointer;
    }

    .send:hover {
      background: linear-gradient(135deg, #5a0c28, #941e49);
    }

    .send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .private-back {
      margin-left: auto;
      padding: 8px 12px;
      border: 1px solid rgba(140,30,70,0.4);
      border-radius: 6px;
      background: transparent;
      color: #b1325c;
      font-size: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .private-back:hover {
      background: #4a0b25;
      color: white;
    }

    @media (max-width: 700px) {

      .chat-container {
        width: 94%;
        height: calc(100vh - 110px);
        min-height: 550px;
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .message-wrapper {
        max-width: 85%;
      }

      .messages {
        padding: 20px;
      }

      .members {
        padding: 20px;
      }

      .chat-input {
        padding: 12px;
      }

      .send {
        padding: 0 16px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">KYLE</div>

  <a href="dashboard.html" class="back">
    ← DASHBOARD
  </a>
</header>

<main class="chat-container">

  <aside class="sidebar">

    <div class="sidebar-title">
      <p>COMMUNITY</p>
      <h2>Fan Community</h2>
    </div>

    <div class="tabs">

      <button class="tab active" id="messagesTab">
        MESSAGES
      </button>

      <button class="tab" id="membersTab">
        MEMBERS
      </button>

    </div>

    <div class="chat-user">

      <div class="avatar" id="sidebarAvatar">
        KF
      </div>

      <div>
        <h3 id="sidebarTitle">
          Official Community
        </h3>

        <span class="online" id="sidebarStatus">
          Live fan discussion
        </span>
      </div>

    </div>

  </aside>

  <section class="chat">

    <div class="chat-header">

      <div class="avatar" id="headerAvatar">
        KF
      </div>

      <div>

        <h2 id="headerTitle">
          Official Community
        </h2>

        <p id="chatStatus">
          Connecting...
        </p>

      </div>

      <button
        id="communityBack"
        class="private-back"
        style="display:none;"
      >
        COMMUNITY
      </button>

    </div>

    <div class="messages" id="messages">

      <div class="empty-chat">
        Loading community chat...
      </div>

    </div>

    <div class="members" id="members">

      <div class="loading-members">
        Loading members...
      </div>

    </div>

    <form class="chat-input" id="chatForm">

      <input
        id="messageInput"
        type="text"
        placeholder="Write a message..."
        autocomplete="off"
        maxlength="500"
        required
      >

      <button
        class="send"
        id="sendButton"
        type="submit"
      >
        SEND
      </button>

    </form>

  </section>

</main>

<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  orderBy,
  onSnapshot,
  serverTimestamp,
  limit,
  getDoc,
  doc,
  getDocs,
  setDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey: "AIzaSyATyGLNPuSu3GMxWjFBijyk2mu57GkVZo4",

  authDomain:
    "kyle-official-website.firebaseapp.com",

  projectId:
    "kyle-official-website",

  storageBucket:
    "kyle-official-website.firebasestorage.app",

  messagingSenderId:
    "547868923755",

  appId:
    "1:547868923755:web:a85ffecce9bf9cc6ff5e2e",

  measurementId:
    "G-799CW529X9"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const messagesBox =
  document.getElementById("messages");

const membersBox =
  document.getElementById("members");

const messageInput =
  document.getElementById("messageInput");

const chatForm =
  document.getElementById("chatForm");

const sendButton =
  document.getElementById("sendButton");

const chatStatus =
  document.getElementById("chatStatus");

const messagesTab =
  document.getElementById("messagesTab");

const membersTab =
  document.getElementById("membersTab");

const headerTitle =
  document.getElementById("headerTitle");

const headerAvatar =
  document.getElementById("headerAvatar");

const sidebarTitle =
  document.getElementById("sidebarTitle");

const sidebarStatus =
  document.getElementById("sidebarStatus");

const sidebarAvatar =
  document.getElementById("sidebarAvatar");

const communityBack =
  document.getElementById("communityBack");


let currentUser = null;

let currentName = "Fan";

let privateUser = null;

let privateUserName = "Member";

let privateConversationId = null;

let unsubscribePrivate = null;


/* URL */

const urlParams =
  new URLSearchParams(
    window.location.search
  );

const targetUid =
  urlParams.get("with");


/* AUTH */

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    window.location.href = "login.html";

    return;
  }

  currentUser = user;


  try {

    const userDoc =
      await getDoc(
        doc(db, "users", user.uid)
      );

    if (userDoc.exists()) {

      const data =
        userDoc.data();

      currentName =
        data.name ||
        data.displayName ||
        user.displayName ||
        user.email.split("@")[0];

    } else {

      currentName =
        user.displayName ||
        user.email.split("@")[0];

    }

  } catch (error) {

    currentName =
      user.displayName ||
      user.email.split("@")[0];

  }


  if (
    targetUid &&
    targetUid !== currentUser.uid
  ) {

    await startPrivateChat(targetUid);

  } else {

    startCommunityChat();

  }

});


/* TABS */

messagesTab.addEventListener("click", () => {

  showCommunityChat();

});


membersTab.addEventListener("click", () => {

  messagesTab.classList.remove("active");

  membersTab.classList.add("active");

  messagesBox.style.display = "none";

  membersBox.classList.add("active");

  chatForm.style.display = "none";

  communityBack.style.display = "none";

  headerTitle.textContent =
    "Community Members";

  chatStatus.textContent =
    "Registered fan members";

  loadMembers();

});


communityBack.addEventListener(
  "click",
  () => {

    window.location.href =
      "chat.html";

  }
);


/* COMMUNITY */

function showCommunityChat() {

  messagesTab.classList.add("active");

  membersTab.classList.remove("active");

  messagesBox.style.display = "flex";

  membersBox.classList.remove("active");

  chatForm.style.display = "flex";

  communityBack.style.display = "none";

  headerAvatar.textContent = "KF";

  sidebarAvatar.textContent = "KF";

  headerTitle.textContent =
    "Official Community";

  sidebarTitle.textContent =
    "Official Community";

  chatStatus.textContent =
    "Live fan discussion";

  sidebarStatus.textContent =
    "Live fan discussion";

  startCommunityChat();

}


function startCommunityChat() {

  if (unsubscribePrivate) {

    unsubscribePrivate();

    unsubscribePrivate = null;

  }


  const messagesQuery =
    query(
      collection(db, "messages"),
      orderBy("createdAt", "asc"),
      limit(100)
    );


  onSnapshot(
    messagesQuery,

    (snapshot) => {

      messagesBox.innerHTML = "";


      if (snapshot.empty) {

        messagesBox.innerHTML = `
          <div class="empty-chat">
            No messages yet. Be the first to say hello! 👋
          </div>
        `;

        return;
      }


      snapshot.forEach((messageDoc) => {

        const data =
          messageDoc.data();

        const isMine =
          data.senderId === currentUser.uid;


        renderMessage(
          data,
          isMine
        );

      });


      messagesBox.scrollTop =
        messagesBox.scrollHeight;

    },

    (error) => {

      console.error(
        "Community chat error:",
        error
      );

      chatStatus.textContent =
        "Unable to load chat";

    }
  );

}


/* PRIVATE CHAT */

async function startPrivateChat(uid) {

  messagesTab.classList.add("active");

  membersTab.classList.remove("active");

  messagesBox.style.display = "flex";

  membersBox.classList.remove("active");

  chatForm.style.display = "flex";

  communityBack.style.display = "block";


  try {

    const targetDoc =
      await getDoc(
        doc(db, "users", uid)
      );


    if (!targetDoc.exists()) {

      alert(
        "This member could not be found."
      );

      window.location.href =
        "chat.html";

      return;
    }


    const data =
      targetDoc.data();


    privateUser =
      uid;

    privateUserName =
      data.name ||
      data.displayName ||
      data.email?.split("@")[0] ||
      "Member";


    privateConversationId =
      [currentUser.uid, uid]
        .sort()
        .join("_");


    await setDoc(
      doc(
        db,
        "conversations",
        privateConversationId
      ),
      {
        participants: [
          currentUser.uid,
          uid
        ],
        updatedAt:
          serverTimestamp()
      },
      {
        merge: true
      }
    );


    const initials =
      getInitials(privateUserName);


    headerAvatar.textContent =
      initials;

    sidebarAvatar.textContent =
      initials;

    headerTitle.textContent =
      privateUserName;

    sidebarTitle.textContent =
      privateUserName;

    chatStatus.textContent =
      "Private conversation";

    sidebarStatus.textContent =
      "Private message";


    messageInput.placeholder =
      "Message " +
      privateUserName +
      "...";


    loadPrivateMessages();

  } catch (error) {

    console.error(
      "Private chat error:",
      error
    );

    alert(
      "Unable to open private chat. Please try again."
    );

  }

}


/* PRIVATE MESSAGES */

function loadPrivateMessages() {

  if (unsubscribePrivate) {

    unsubscribePrivate();

  }


  const privateMessagesQuery =
    query(
      collection(
        db,
        "conversations",
        privateConversationId,
        "messages"
      ),
      orderBy("createdAt", "asc"),
      limit(100)
    );


  unsubscribePrivate =
    onSnapshot(

      privateMessagesQuery,

      (snapshot) => {

        messagesBox.innerHTML = "";


        if (snapshot.empty) {

          messagesBox.innerHTML = `
            <div class="empty-chat">
              Start your private conversation with
              ${escapeHTML(privateUserName)} 💬
            </div>
          `;

          return;
        }


        snapshot.forEach(
          (messageDoc) => {

            const data =
              messageDoc.data();

            const isMine =
              data.senderId ===
              currentUser.uid;


            renderMessage(
              data,
              isMine
            );

          }
        );


        messagesBox.scrollTop =
          messagesBox.scrollHeight;

      },

      (error) => {

        console.error(
          "Private messages error:",
          error
        );

        chatStatus.textContent =
          "Unable to load private messages";

      }

    );

}


/* SEND */

chatForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const text =
      messageInput.value.trim();


    if (
      !text ||
      !currentUser
    ) {

      return;

    }


    sendButton.disabled =
      true;

    sendButton.textContent =
      "SENDING...";


    try {

      if (
        privateUser &&
        privateConversationId
      ) {

        await addDoc(
          collection(
            db,
            "conversations",
            privateConversationId,
            "messages"
          ),
          {

            senderId:
              currentUser.uid,

            senderName:
              currentName,

            receiverId:
              privateUser,

            message:
              text,

            createdAt:
              serverTimestamp()

          }
        );


        await setDoc(
          doc(
            db,
            "conversations",
            privateConversationId
          ),
          {
            updatedAt:
              serverTimestamp(),

            lastMessage:
              text
          },
          {
            merge: true
          }
        );


      } else {

        await addDoc(
          collection(db, "messages"),
          {

            senderId:
              currentUser.uid,

            senderName:
              currentName,

            email:
              currentUser.email || "",

            message:
              text,

            createdAt:
              serverTimestamp()

          }
        );

      }


      messageInput.value = "";


    } catch (error) {

      console.error(
        "Send message error:",
        error
      );


      alert(
        "Message could not be sent. Please try again."
      );

    }


    sendButton.disabled =
      false;

    sendButton.textContent =
      "SEND";

    messageInput.focus();

  }
);


/* RENDER MESSAGE */

function renderMessage(
  data,
  isMine
) {

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message-wrapper " +
    (isMine
      ? "sent"
      : "received");


  const sender =
    document.createElement("div");

  sender.className =
    "sender";

  sender.textContent =
    isMine
      ? "You"
      : (data.senderName || "Fan");


  const message =
    document.createElement("div");

  message.className =
    "message";

  message.textContent =
    data.message || "";


  const time =
    document.createElement("span");

  time.className =
    "time";


  if (data.createdAt) {

    time.textContent =
      formatTime(
        data.createdAt.toDate()
      );

  } else {

    time.textContent =
      "Just now";

  }


  message.appendChild(time);

  wrapper.appendChild(sender);

  wrapper.appendChild(message);

  messagesBox.appendChild(wrapper);

}


/* MEMBERS */

async function loadMembers() {

  membersBox.innerHTML = `
    <div class="loading-members">
      Loading members...
    </div>
  `;


  try {

    const usersSnapshot =
      await getDocs(
        collection(db, "users")
      );


    membersBox.innerHTML = `

      <div class="members-heading">

        <h2>Community Members</h2>

        <p>
          ${usersSnapshot.size} registered fan
          ${usersSnapshot.size === 1
            ? "member"
            : "members"}
        </p>

      </div>

    `;


    if (usersSnapshot.empty) {

      membersBox.innerHTML += `
        <div class="empty-chat">
          No members found yet.
        </div>
      `;

      return;

    }


    usersSnapshot.forEach(
      (userDoc) => {

        const data =
          userDoc.data();


        const name =
          data.name ||
          data.displayName ||
          "Fan Member";


        const email =
          data.email || "";


        const initials =
          getInitials(name);


        const card =
          document.createElement("div");

        card.className =
          "member-card";


        card.innerHTML = `

          <div class="avatar">
            ${escapeHTML(initials)}
          </div>

          <div class="member-info">

            <h3>
              ${escapeHTML(name)}
            </h3>

            <p>
              ${email
                ? escapeHTML(email)
                : "Fan Member"}
            </p>

            <div class="member-status">
              Community Member
            </div>

          </div>

          <button
            class="profile-btn"
            type="button"
          >
            PROFILE
          </button>

        `;


        const profileButton =
          card.querySelector(
            ".profile-btn"
          );


        profileButton.addEventListener(
          "click",
          () => {

            window.location.href =
              "profile.html?uid=" +
              userDoc.id;

          }
        );


        membersBox.appendChild(card);

      }
    );


  } catch (error) {

    console.error(
      "Members error:",
      error
    );


    membersBox.innerHTML = `

      <div class="empty-chat">

        Unable to load members.

        <br><br>

        Please check your Firebase
        Firestore permissions.

      </div>

    `;

  }

}


/* HELPERS */

function getInitials(name) {

  return name
    .split(" ")
    .map(
      word =>
        word.charAt(0)
    )
    .join("")
    .substring(0, 2)
    .toUpperCase();

}


function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}


function formatTime(date) {

  return date.toLocaleTimeString(
    [],
    {
      hour: "numeric",
      minute: "2-digit"
    }
  );

}
