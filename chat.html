<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community Chat | Kyle Fuller Official Web</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#050505;
  color:#fff;
  min-height:100vh;
}

.chat-container{
  width:92%;
  max-width:1200px;
  height:88vh;
  min-height:600px;
  margin:40px auto;
  background:#0b0b0b;
  border:1px solid #241216;
  border-radius:18px;
  overflow:hidden;
  display:grid;
  grid-template-columns:250px 1fr;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* SIDEBAR */

.sidebar{
  background:#080808;
  border-right:1px solid #241216;
  display:flex;
  flex-direction:column;
}

.sidebar-title{
  padding:25px 20px;
  font-size:20px;
  font-weight:bold;
  color:#fff;
  border-bottom:1px solid #241216;
}

.chat-user{
  padding:18px 20px;
  border-bottom:1px solid #241216;
  display:flex;
  align-items:center;
  gap:12px;
}

.chat-user-info{
  min-width:0;
}

.chat-user-name{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-user-status{
  font-size:11px;
  color:#888;
  margin-top:4px;
}

.tabs{
  display:flex;
  flex-direction:column;
}

.tab{
  border:0;
  background:transparent;
  color:#aaa;
  padding:18px 20px;
  text-align:left;
  cursor:pointer;
  font-size:14px;
  border-bottom:1px solid #151515;
  transition:.2s;
}

.tab:hover,
.tab.active{
  color:#fff;
  background:#14090c;
}

.tab.active{
  border-left:3px solid #8b3949;
}

/* AVATARS */

.avatar{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:#8b3949;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  color:#fff;
  font-weight:bold;
  font-size:14px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

/* CHAT AREA */

.chat{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  height:76px;
  border-bottom:1px solid #241216;
  padding:14px 20px;
  display:flex;
  align-items:center;
  gap:12px;
}

.chat-header-info{
  min-width:0;
}

.chat-header-title{
  font-size:17px;
  font-weight:bold;
}

.chat-status{
  color:#777;
  font-size:12px;
  margin-top:4px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:25px;
}

.message-wrapper{
  display:flex;
  gap:10px;
  margin-bottom:18px;
  max-width:75%;
}

.message-wrapper.mine{
  margin-left:auto;
  flex-direction:row-reverse;
}

.message-avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:50%;
  overflow:hidden;
  background:#8b3949;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:11px;
  font-weight:bold;
}

.message-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.message-content{
  min-width:0;
}

.message-name{
  font-size:11px;
  color:#999;
  margin-bottom:5px;
}

.message-bubble{
  background:#151515;
  border:1px solid #25171a;
  padding:10px 13px;
  border-radius:12px;
  line-height:1.5;
  font-size:14px;
  word-wrap:break-word;
}

.mine .message-bubble{
  background:#6d2d3b;
  border-color:#8b3949;
}

.message-time{
  font-size:9px;
  color:#666;
  margin-top:4px;
}

/* INPUT */

.chat-input{
  display:flex;
  gap:10px;
  padding:15px;
  border-top:1px solid #241216;
}

.chat-input input{
  flex:1;
  min-width:0;
  background:#111;
  color:#fff;
  border:1px solid #302024;
  border-radius:10px;
  padding:13px;
  outline:none;
}

.chat-input input:focus{
  border-color:#8b3949;
}

.send{
  border:0;
  background:#8b3949;
  color:#fff;
  padding:0 22px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.send:hover{
  background:#a8475a;
}

/* MEMBERS */

.members,
.inbox{
  flex:1;
  overflow-y:auto;
  padding:25px;
  display:none;
}

.member-card,
.inbox-card{
  background:#101010;
  border:1px solid #241216;
  border-radius:12px;
  padding:14px;
  margin-bottom:12px;
  display:flex;
  align-items:center;
  gap:12px;
}

.member-info,
.inbox-info{
  flex:1;
  min-width:0;
}

.member-name,
.inbox-name{
  font-weight:bold;
  font-size:14px;
}

.member-email,
.inbox-last{
  color:#777;
  font-size:11px;
  margin-top:5px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.member-button{
  background:#8b3949;
  color:#fff;
  border:0;
  padding:9px 12px;
  border-radius:7px;
  cursor:pointer;
  text-decoration:none;
  font-size:11px;
}

.member-button:hover{
  background:#a8475a;
}

.inbox-time{
  color:#666;
  font-size:10px;
  margin-top:4px;
}

.open-button{
  background:#8b3949;
  color:white;
  border:0;
  padding:9px 12px;
  border-radius:7px;
  cursor:pointer;
}

/* BACK BUTTON */

.back-button{
  display:inline-block;
  position:fixed;
  top:15px;
  left:15px;
  color:#aaa;
  text-decoration:none;
  font-size:13px;
}

.back-button:hover{
  color:#fff;
}

/* MOBILE */

@media(max-width:700px){

  .chat-container{
    width:94%;
    height:calc(100vh - 105px);
    min-height:550px;
    grid-template-columns:1fr;
    position:relative;
    margin:20px auto;
  }

  .sidebar{
    display:block;
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:104px;
    z-index:10;
    border-right:none;
    background:#080808;
  }

  .sidebar-title,
  .chat-user{
    display:none;
  }

  .tabs{
    height:104px;
    display:flex;
    flex-direction:row;
    align-items:flex-end;
  }

  .tab{
    flex:1;
    height:55px;
    padding:15px 5px;
    text-align:center;
    font-size:11px;
  }

  .tab.active{
    border-left:0;
    border-bottom:3px solid #8b3949;
  }

  .chat{
    margin-top:104px;
    height:calc(100% - 104px);
  }

  .message-wrapper{
    max-width:85%;
  }

  .messages,
  .members,
  .inbox{
    padding:20px;
  }

  .chat-input{
    padding:12px;
  }

  .send{
    padding:0 16px;
  }

  .inbox-last{
    max-width:130px;
  }
}
</style>
</head>

<body>

<a href="dashboard.html" class="back-button">← Dashboard</a>

<div class="chat-container">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-title">
      FAN COMMUNITY
    </div>

    <div class="chat-user">

      <div class="avatar" id="sidebarAvatar">
        <span id="sidebarInitials">?</span>
      </div>

      <div class="chat-user-info">
        <div class="chat-user-name" id="sidebarName">
          Loading...
        </div>

        <div class="chat-user-status" id="sidebarStatus">
          Connecting...
        </div>
      </div>

    </div>

    <div class="tabs">

      <button class="tab active" id="communityTab">
        COMMUNITY
      </button>

      <button class="tab" id="membersTab">
        MEMBERS
      </button>

      <button class="tab" id="inboxTab">
        INBOX
      </button>

    </div>

  </aside>


  <!-- COMMUNITY CHAT -->

  <main class="chat" id="chatSection">

    <header class="chat-header">

      <div class="avatar" id="headerAvatar">
        <span id="headerInitials">KF</span>
      </div>

      <div class="chat-header-info">

        <div class="chat-header-title" id="chatTitle">
          Kyle Fuller Community
        </div>

        <div class="chat-status" id="chatStatus">
          Connecting...
        </div>

      </div>

    </header>


    <div class="messages" id="messages"></div>


    <form class="chat-input" id="messageForm">

      <input
        type="text"
        id="messageInput"
        placeholder="Write a message..."
        autocomplete="off"
      >

      <button class="send" type="submit">
        SEND
      </button>

    </form>

  </main>


  <!-- MEMBERS -->

  <section class="members" id="membersSection">

    <h2 style="margin-bottom:20px;">
      Community Members
    </h2>

    <div id="membersList"></div>

  </section>


  <!-- INBOX -->

  <section class="inbox" id="inboxSection">

    <h2 style="margin-bottom:20px;">
      Private Inbox
    </h2>

    <div id="inboxList"></div>

  </section>

</div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  doc,
  getDoc,
  setDoc,
  addDoc,
  query,
  where,
  orderBy,
  onSnapshot,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyATyGLNPuSu3GMxWjFBijyk2mu57GkVZo4",
  authDomain: "kyle-official-website.firebaseapp.com",
  projectId: "kyle-official-website",
  storageBucket: "kyle-official-website.firebasestorage.app",
  messagingSenderId: "547868923755",
  appId: "1:547868923755:web:a85ffecce9bf9cc6ff5e2e",
  measurementId: "G-799CW529X9"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* ELEMENTS */

const messagesBox =
  document.getElementById("messages");

const messageForm =
  document.getElementById("messageForm");

const messageInput =
  document.getElementById("messageInput");

const membersSection =
  document.getElementById("membersSection");

const inboxSection =
  document.getElementById("inboxSection");

const chatSection =
  document.getElementById("chatSection");

const membersList =
  document.getElementById("membersList");

const inboxList =
  document.getElementById("inboxList");

const chatTitle =
  document.getElementById("chatTitle");

const chatStatus =
  document.getElementById("chatStatus");

const sidebarName =
  document.getElementById("sidebarName");

const sidebarStatus =
  document.getElementById("sidebarStatus");

const sidebarAvatar =
  document.getElementById("sidebarAvatar");

const headerAvatar =
  document.getElementById("headerAvatar");


/* STATE */

let currentUser = null;

let currentUserProfile = {};

let unsubscribeMessages = null;

let currentPrivateUser = null;


/* URL */

const urlParams =
  new URLSearchParams(window.location.search);

const privateUid =
  urlParams.get("with");


/* HELPERS */

function getInitials(name){

  if(!name){
    return "?";
  }

  return name
    .split(" ")
    .filter(Boolean)
    .slice(0,2)
    .map(word => word[0])
    .join("")
    .toUpperCase();

}


function escapeHTML(text){

  if(text === null || text === undefined){
    return "";
  }

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatTime(timestamp){

  if(!timestamp){
    return "";
  }

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });

  }catch(error){

    return "";

  }

}


function formatDate(timestamp){

  if(!timestamp){
    return "";
  }

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleDateString([],{
      day:"numeric",
      month:"short"
    });

  }catch(error){

    return "";

  }

}


/* PROFILE PHOTO HTML */

function avatarHTML(profile,name,className=""){

  const initials =
    getInitials(name);

  const image =
    profile?.profileImage;

  if(image){

    return `
      <div class="avatar ${className}">
        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(name || "Profile")}"
        >
      </div>
    `;

  }

  return `
    <div class="avatar ${className}">
      ${escapeHTML(initials)}
    </div>
  `;

}


function messageAvatarHTML(profile,name){

  const initials =
    getInitials(name);

  const image =
    profile?.profileImage;

  if(image){

    return `
      <div class="message-avatar">
        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(name || "Profile")}"
        >
      </div>
    `;

  }

  return `
    <div class="message-avatar">
      ${escapeHTML(initials)}
    </div>
  `;

}


/* LOAD USER PROFILE */

async function loadCurrentUser(){

  const userDoc =
    await getDoc(
      doc(db,"users",currentUser.uid)
    );

  if(userDoc.exists()){

    currentUserProfile =
      userDoc.data();

  }

  const name =
    currentUserProfile.name ||
    currentUser.displayName ||
    currentUser.email?.split("@")[0] ||
    "Fan";

  sidebarName.textContent =
    name;

  sidebarAvatar.innerHTML =
    currentUserProfile.profileImage
      ? `<img src="${escapeHTML(currentUserProfile.profileImage)}" alt="Profile">`
      : `<span>${escapeHTML(getInitials(name))}</span>`;

}


/* AUTH */

onAuthStateChanged(auth, async(user)=>{

  if(!user){

    window.location.href =
      "login.html";

    return;

  }

  currentUser =
    user;

  await loadCurrentUser();

  if(privateUid){

    await openPrivateChat(privateUid);

  }else{

    openCommunityChat();

  }

  loadMembers();

  loadInbox();

});


/* COMMUNITY CHAT */

function openCommunityChat(){

  currentPrivateUser = null;

  chatTitle.textContent =
    "Kyle Fuller Community";

  chatStatus.textContent =
    "Live fan discussion";

  sidebarStatus.textContent =
    "Live fan discussion";

  messagesBox.innerHTML =
    "";

  if(unsubscribeMessages){

    unsubscribeMessages();

  }

  const messagesQuery =
    query(
      collection(db,"messages"),
      orderBy("createdAt","asc")
    );

  unsubscribeMessages =
    onSnapshot(
      messagesQuery,
      async(snapshot)=>{

        messagesBox.innerHTML =
          "";

        const messages =
          snapshot.docs;

        const profileCache =
          {};

        for(const messageDoc of messages){

          const data =
            messageDoc.data();

          let profile =
            profileCache[data.senderId];

          if(!profile){

            try{

              const userDoc =
                await getDoc(
                  doc(db,"users",data.senderId)
                );

              profile =
                userDoc.exists()
                  ? userDoc.data()
                  : {};

              profileCache[data.senderId] =
                profile;

            }catch(error){

              profile = {};

            }

          }

          const senderName =
            data.senderName ||
            profile.name ||
            "Fan";

          const wrapper =
            document.createElement("div");

          wrapper.className =
            "message-wrapper" +
            (data.senderId === currentUser.uid
              ? " mine"
              : "");

          wrapper.innerHTML = `

            ${messageAvatarHTML(
              profile,
              senderName
            )}

            <div class="message-content">

              <div class="message-name">
                ${escapeHTML(senderName)}
              </div>

              <div class="message-bubble">
                ${escapeHTML(data.text)}
              </div>

              <div class="message-time">
                ${formatTime(data.createdAt)}
              </div>

            </div>

          `;

          messagesBox.appendChild(wrapper);

        }

        messagesBox.scrollTop =
          messagesBox.scrollHeight;

        chatStatus.textContent =
          "Live fan discussion";

        sidebarStatus.textContent =
          "Live fan discussion";

      },
      (error)=>{

        console.error(
          "Community chat error:",
          error
        );

        chatStatus.textContent =
          "Chat unavailable";

      }
    );

}


/* SEND COMMUNITY MESSAGE */

messageForm.addEventListener(
  "submit",
  async(event)=>{

    event.preventDefault();

    const text =
      messageInput.value.trim();

    if(!text || !currentUser){
      return;
    }

    const senderName =
      currentUserProfile.name ||
      currentUser.displayName ||
      currentUser.email?.split("@")[0] ||
      "Fan";

    try{

      await addDoc(
        collection(db,"messages"),
        {
          text:text,
          senderId:currentUser.uid,
          senderName:senderName,
          createdAt:serverTimestamp()
        }
      );

      messageInput.value =
        "";

    }catch(error){

      console.error(
        "Send message error:",
        error
      );

      alert(
        "Message could not be sent."
      );

    }

  }
);


/* LOAD MEMBERS */

async function loadMembers(){

  const usersQuery =
    query(
      collection(db,"users")
    );

  onSnapshot(
    usersQuery,
    (snapshot)=>{

      membersList.innerHTML =
        "";

      snapshot.forEach(
        (userDoc)=>{

          const data =
            userDoc.data();

          if(userDoc.id === currentUser.uid){
            return;
          }

          const name =
            data.name ||
            data.email?.split("@")[0] ||
            "Fan";

          const card =
            document.createElement("div");

          card.className =
            "member-card";

          card.innerHTML = `

            ${avatarHTML(data,name)}

            <div class="member-info">

              <div class="member-name">
                ${escapeHTML(name)}
              </div>

              <div class="member-email">
                Fan community member
              </div>

            </div>

            <a
              class="member-button"
              href="chat.html?with=${encodeURIComponent(userDoc.id)}"
            >
              MESSAGE
            </a>

          `;

          membersList.appendChild(card);

        }

      if(!membersList.children.length){

        membersList.innerHTML =
          `<p style="color:#777;">No other members yet.</p>`;

      }

    },
    (error)=>{

      console.error(
        "Members error:",
        error
      );

      membersList.innerHTML =
        `<p style="color:#777;">Unable to load members.</p>`;

    }
  );

}


/* OPEN PRIVATE CHAT */

async function openPrivateChat(uid){

  if(uid === currentUser.uid){

    openCommunityChat();

    return;

  }

  try{

    const userDoc =
      await getDoc(
        doc(db,"users",uid)
      );

    if(!userDoc.exists()){

      chatTitle.textContent =
        "Member not found";

      chatStatus.textContent =
        "";

      return;

    }

    const otherUser =
      userDoc.data();

    currentPrivateUser = {
      uid:uid,
      ...otherUser
    };

    const name =
      otherUser.name ||
      otherUser.email?.split("@")[0] ||
      "Fan";

    chatTitle.textContent =
      name;

    chatStatus.textContent =
      "Private conversation";

    sidebarStatus.textContent =
      "Private message";

    headerAvatar.innerHTML =
      otherUser.profileImage
        ? `<img src="${escapeHTML(otherUser.profileImage)}" alt="${escapeHTML(name)}">`
        : `<span>${escapeHTML(getInitials(name))}</span>`;

    if(unsubscribeMessages){

      unsubscribeMessages();

    }

    messagesBox.innerHTML =
      "";

    const conversationId =
      [currentUser.uid,uid]
        .sort()
        .join("_");

    const conversationRef =
      doc(
        db,
        "conversations",
        conversationId
      );

    await setDoc(
      conversationRef,
      {
        participants:[
          currentUser.uid,
          uid
        ],
        updatedAt:serverTimestamp()
      },
      {merge:true}
    );

    const privateMessagesQuery =
      query(
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),
        orderBy("createdAt","asc")
      );

    unsubscribeMessages =
      onSnapshot(
        privateMessagesQuery,
        async(snapshot)=>{

          messagesBox.innerHTML =
            "";

          for(
            const messageDoc of snapshot.docs
          ){

            const data =
              messageDoc.data();

            let profile =
              {};

            try{

              const profileDoc =
                await getDoc(
                  doc(
                    db,
                    "users",
                    data.senderId
                  )
                );

              if(profileDoc.exists()){

                profile =
                  profileDoc.data();

              }

            }catch(error){

              console.error(
                "Profile loading error:",
                error
              );

            }

            const senderName =
              data.senderName ||
              profile.name ||
              "Fan";

            const wrapper =
              document.createElement("div");

            wrapper.className =
              "message-wrapper" +
              (
                data.senderId === currentUser.uid
                  ? " mine"
                  : ""
              );

            wrapper.innerHTML = `

              ${messageAvatarHTML(
                profile,
                senderName
              )}

              <div class="message-content">

                <div class="message-name">
                  ${escapeHTML(senderName)}
                </div>

                <div class="message-bubble">
                  ${escapeHTML(data.text)}
                </div>

                <div class="message-time">
                  ${formatTime(data.createdAt)}
                </div>

              </div>

            `;

            messagesBox.appendChild(wrapper);

          }

          messagesBox.scrollTop =
            messagesBox.scrollHeight;

          chatStatus.textContent =
            "Private conversation";

          sidebarStatus.textContent =
            "Private message";

        },
        (error)=>{

          console.error(
            "Private chat error:",
            error
          );

          chatStatus.textContent =
            "Private chat unavailable";

        }
      );

  }catch(error){

    console.error(
      "Open private chat error:",
      error
    );

  }

}


/* SEND PRIVATE MESSAGE */

messageForm.addEventListener(
  "submit",
  async(event)=>{

    event.preventDefault();

    if(!currentPrivateUser){
      return;
    }

    const text =
      messageInput.value.trim();

    if(!text){
      return;
    }

    const senderName =
      currentUserProfile.name ||
      currentUser.displayName ||
      currentUser.email?.split("@")[0] ||
      "Fan";

    try{

      const conversationId =
        [currentUser.uid,currentPrivateUser.uid]
          .sort()
          .join("_");

      const conversationRef =
        doc(
          db,
          "conversations",
          conversationId
        );

      await setDoc(
        conversationRef,
        {
          participants:[
            currentUser.uid,
            currentPrivateUser.uid
          ],
          updatedAt:serverTimestamp(),
          lastMessage:text,
          lastSenderId:currentUser.uid
        },
        {merge:true}
      );

      await addDoc(
        collection(
          db,
          "conversations",
          conversationId,
          "messages"
        ),
        {
          text:text,
          senderId:currentUser.uid,
          senderName:senderName,
          createdAt:serverTimestamp()
        }
      );

      messageInput.value =
        "";

    }catch(error){

      console.error(
        "Private send error:",
        error
      );

      alert(
        "Private message could not be sent."
      );

    }

  }
);


/* LOAD INBOX */

function loadInbox(){

  const inboxQuery =
    query(
      collection(db,"conversations"),
      where(
        "participants",
        "array-contains",
        currentUser.uid
      )
    );

  onSnapshot(
    inboxQuery,
    async(snapshot)=>{

      inboxList.innerHTML =
        "";

      const conversations =
        snapshot.docs
          .map(docSnap => ({
            id:docSnap.id,
            ...docSnap.data()
          }))
          .sort(
            (a,b)=>{

              const aTime =
                a.updatedAt?.toMillis
                  ? a.updatedAt.toMillis()
                  : 0;

              const bTime =
                b.updatedAt?.toMillis
                  ? b.updatedAt.toMillis()
                  : 0;

              return bTime-aTime;

            }
          );

      for(
        const conversation
        of conversations
      ){

        const otherUid =
          conversation.participants
            ?.find(
              uid =>
                uid !== currentUser.uid
            );

        if(!otherUid){
          continue;
        }

        let otherProfile =
          {};

        try{

          const userDoc =
            await getDoc(
              doc(
                db,
                "users",
                otherUid
              )
            );

          if(userDoc.exists()){

            otherProfile =
              userDoc.data();

          }

        }catch(error){

          console.error(
            "Inbox profile error:",
            error
          );

        }

        const otherName =
          otherProfile.name ||
          otherProfile.email?.split("@")[0] ||
          "Fan";

        const card =
          document.createElement("div");

        card.className =
          "inbox-card";

        card.innerHTML = `

          ${avatarHTML(
            otherProfile,
            otherName
          )}

          <div class="inbox-info">

            <div class="inbox-name">
              ${escapeHTML(otherName)}
            </div>

            <div class="inbox-last">
              ${escapeHTML(
                conversation.lastMessage ||
                "Private conversation"
              )}
            </div>

            <div class="inbox-time">
              ${formatDate(conversation.updatedAt)}
            </div>

          </div>

          <button
            class="open-button"
            data-uid="${escapeHTML(otherUid)}"
          >
            OPEN
          </button>

        `;

        card
          .querySelector(".open-button")
          .addEventListener(
            "click",
            ()=>{

              window.location.href =
                `chat.html?with=${encodeURIComponent(otherUid)}`;

            }
          );

        inboxList.appendChild(card);

      }

      if(!inboxList.children.length){

        inboxList.innerHTML =
          `<p style="color:#777;">
            No private conversations yet.
          </p>`;

      }

    },
    (error)=>{

      console.error(
        "Inbox error:",
        error
      );

      inboxList.innerHTML =
        `<p style="color:#777;">
          Unable to load inbox.
        </p>`;

    }
  );

}


/* TAB SWITCHING */

document
  .getElementById("communityTab")
  .addEventListener(
    "click",
    ()=>{

      setActiveTab("community");

    }
  );


document
  .getElementById("membersTab")
  .addEventListener(
    "click",
    ()=>{

      setActiveTab("members");

    }
  );


document
  .getElementById("inboxTab")
  .addEventListener(
    "click",
    ()=>{

      setActiveTab("inbox");

    }
  );


function setActiveTab(tab){

  document
    .querySelectorAll(".tab")
    .forEach(button =>
      button.classList.remove("active")
    );

  chatSection.style.display =
    "none";

  membersSection.style.display =
    "none";

  inboxSection.style.display =
    "none";

  if(tab === "community"){

    document
      .getElementById("communityTab")
      .classList.add("active");

    chatSection.style.display =
      "flex";

    if(!privateUid){

      openCommunityChat();

    }

  }

  if(tab === "members"){

    document
      .getElementById("membersTab")
      .classList.add("active");

    membersSection.style.display =
      "block";

  }

  if(tab === "inbox"){

    document
      .getElementById("inboxTab")
      .classList.add("active");

    inboxSection.style.display =
      "block";

  }

}


/* IF OPENING A PRIVATE CHAT */

if(privateUid){

  document
    .getElementById("communityTab")
    .classList.add("active");

}

</script>
