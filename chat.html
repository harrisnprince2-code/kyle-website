<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>Kyle Official — Messages</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100dvh;
}

button,
input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* =========================
   APP
========================= */

.chat-app{
  width:100%;
  height:100dvh;
  display:flex;
  overflow:hidden;
  background:#050505;
}

/* Prevent page from showing
   while Firebase checks login */

.chat-app.loading-app{
  visibility:hidden;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
  width:360px;
  min-width:360px;
  height:100%;
  background:#090909;
  border-right:1px solid #241216;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.sidebar-header{
  padding:18px 20px;
  border-bottom:1px solid #241216;
  flex-shrink:0;
}

.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:20px;
  font-weight:800;
  letter-spacing:1px;
}

.brand span{
  color:#9b3d50;
}

.dashboard-btn{
  border:1px solid #302024;
  background:#111;
  color:#fff;
  border-radius:8px;
  padding:8px 11px;
  font-size:12px;
  font-weight:700;
  text-decoration:none;
  white-space:nowrap;
}

.dashboard-btn:hover{
  background:#722c3d;
}

.sidebar-status{
  margin-top:7px;
  color:#888;
  font-size:12px;
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  border-bottom:1px solid #241216;
  flex-shrink:0;
}

.tab-btn{
  flex:1;
  padding:15px 5px;
  border:0;
  background:transparent;
  color:#777;
  font-size:13px;
  font-weight:700;
}

.tab-btn.active{
  color:#fff;
  border-bottom:2px solid #9b3d50;
}

/* =========================
   SIDEBAR CONTENT
========================= */

.sidebar-content{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
}

.sidebar-view{
  display:none;
}

.sidebar-view.active{
  display:block;
}

.list-empty{
  padding:40px 20px;
  text-align:center;
  color:#777;
  font-size:14px;
}

/* =========================
   CARDS
========================= */

.person-card,
.conversation-card{
  width:100%;
  padding:14px 16px;
  display:flex;
  align-items:center;
  gap:12px;
  border:0;
  border-bottom:1px solid #171717;
  background:transparent;
  color:#fff;
  text-align:left;
}

.person-card:hover,
.conversation-card:hover{
  background:#111;
}

.person-card:active,
.conversation-card:active{
  background:#171717;
}

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  background:#792d3e;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:16px;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.person-info{
  min-width:0;
  flex:1;
}

.person-name{
  font-size:15px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.person-email,
.conversation-preview{
  margin-top:5px;
  color:#777;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =========================
   MAIN CHAT
========================= */

.main-chat{
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(
      circle at center,
      rgba(91,25,39,.10),
      transparent 45%
    ),
    #050505;
}

.chat-header{
  min-height:72px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:12px;
  border-bottom:1px solid #241216;
  background:#080808;
  flex-shrink:0;
}

.back-btn{
  display:none;
  border:0;
  background:transparent;
  color:#fff;
  font-size:25px;
  padding:5px 8px 5px 0;
}

.header-avatar{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:50%;
  overflow:hidden;
  background:#792d3e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.header-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.header-info{
  min-width:0;
}

.chat-title{
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-status{
  margin-top:4px;
  color:#777;
  font-size:12px;
}

/* =========================
   BODY
========================= */

.chat-body{
  flex:1;
  min-height:0;
  position:relative;
  overflow:hidden;
}

.content-view{
  position:absolute;
  inset:0;
  display:none;
  flex-direction:column;
  overflow:hidden;
}

.content-view.active{
  display:flex;
}

/* =========================
   MESSAGES
========================= */

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:22px 24px;
  scroll-behavior:smooth;
}

.message-wrapper{
  display:flex;
  gap:9px;
  margin-bottom:17px;
  max-width:75%;
  animation:messageIn .12s ease;
}

@keyframes messageIn{

  from{
    opacity:0;
    transform:translateY(3px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

.message-wrapper.mine{
  margin-left:auto;
  flex-direction:row-reverse;
}

.message-avatar{
  width:34px;
  height:34px;
  min-width:34px;
  border-radius:50%;
  overflow:hidden;
  background:#792d3e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:800;
}

.message-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.message-content{
  min-width:0;
}

.sender-name{
  margin-bottom:5px;
  color:#aaa;
  font-size:11px;
  font-weight:700;
}

.message-wrapper.mine .sender-name{
  text-align:right;
}

.message-bubble{
  padding:10px 13px;
  border-radius:15px;
  background:#171717;
  border:1px solid #241216;
  color:#f4f4f4;
  font-size:14px;
  line-height:1.45;
  word-break:break-word;
}

.message-wrapper.mine .message-bubble{
  background:#722c3d;
  border-color:#722c3d;
}

.message-time{
  margin-top:4px;
  color:#666;
  font-size:9px;
}

.message-wrapper.mine .message-time{
  text-align:right;
}

.loading{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#777;
  font-size:13px;
  text-align:center;
  padding:20px;
}

/* =========================
   COMPOSER
========================= */

.composer{
  display:none;
  padding:10px 14px;
  padding-bottom:calc(
    10px + env(safe-area-inset-bottom)
  );
  border-top:1px solid #241216;
  background:#080808;
  flex-shrink:0;
}

.composer-form{
  display:flex;
  gap:8px;
  align-items:center;
}

.composer-input{
  flex:1;
  min-width:0;
  height:44px;
  border:1px solid #302024;
  border-radius:22px;
  outline:none;
  background:#121212;
  color:#fff;
  padding:0 16px;
  font-size:16px;
}

.composer-input:focus{
  border-color:#8b3949;
}

.send-btn{
  width:44px;
  height:44px;
  min-width:44px;
  border:0;
  border-radius:50%;
  background:#8b3949;
  color:#fff;
  font-size:18px;
  font-weight:800;
}

.send-btn:active{
  transform:scale(.95);
}

/* =========================
   SCROLLBAR
========================= */

::-webkit-scrollbar{
  width:5px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:#332126;
  border-radius:10px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .chat-app{
    position:fixed;
    inset:0;
    width:100%;
    height:100dvh;
  }

  .sidebar{
    width:100%;
    min-width:100%;
    border-right:0;
  }

  .main-chat{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    transform:translateX(100%);
    transition:transform .2s ease;
    z-index:5;
  }

  .chat-app.chat-open .main-chat{
    transform:translateX(0);
  }

  .chat-app.community-open .main-chat{
    transform:translateX(0);
  }

  .chat-app.chat-open .sidebar,
  .chat-app.community-open .sidebar{
    display:none;
  }

  .chat-header{
    min-height:66px;
    padding:10px 14px;
  }

  .back-btn{
    display:block;
  }

  .messages{
    padding:18px 12px;
  }

  .message-wrapper{
    max-width:88%;
  }

  .sidebar-header{
    padding:16px;
  }

  .tab-btn{
    padding:14px 4px;
  }

  .composer{
    padding-left:9px;
    padding-right:9px;
  }

  .person-card,
  .conversation-card{
    padding:13px 14px;
  }

  .dashboard-btn{
    padding:7px 9px;
  }

}

</style>
</head>

<script type="module">

/* =========================
   FIREBASE
========================= */

const firebaseConfig = {

  authDomain:
    "kyle-official-website.firebaseapp.com",

  projectId:
    "kyle-official-website",

  storageBucket:
    "kyle-official-website.firebasestorage.app",

  messagingSenderId:
    "547868923755",

    "1:547868923755:web:a85ffecce9bf9cc6ff5e2e",

  measurementId:
    "G-799CW529X9"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* =========================
   ELEMENTS
========================= */

const chatApp =
  document.getElementById("chatApp");

const communityTab =
  document.getElementById("communityTab");

const membersTab =
  document.getElementById("membersTab");

const inboxTab =
  document.getElementById("inboxTab");

const communityListView =
  document.getElementById("communityListView");

const membersView =
  document.getElementById("membersView");

const inboxView =
  document.getElementById("inboxView");

const membersList =
  document.getElementById("membersList");

const inboxList =
  document.getElementById("inboxList");

const membersLoading =
  document.getElementById("membersLoading");

const inboxLoading =
  document.getElementById("inboxLoading");

const communityChatView =
  document.getElementById("communityChatView");

const privateChatView =
  document.getElementById("privateChatView");

const communityMessages =
  document.getElementById("communityMessages");

const privateMessages =
  document.getElementById("privateMessages");

const composer =
  document.getElementById("composer");

const messageForm =
  document.getElementById("messageForm");

const messageInput =
  document.getElementById("messageInput");

const backButton =
  document.getElementById("backButton");

const chatTitle =
  document.getElementById("chatTitle");

const chatStatus =
  document.getElementById("chatStatus");

const sidebarStatus =
  document.getElementById("sidebarStatus");

const headerAvatar =
  document.getElementById("headerAvatar");


/* =========================
   STATE
========================= */

let currentUser = null;

let currentUserProfile = null;

let currentView = "inbox";

let currentPrivateUser = null;

let currentConversationId = null;

let lastListView = "inbox";

let communityUnsubscribe = null;

let privateUnsubscribe = null;

let membersUnsubscribe = null;

let inboxUnsubscribe = null;


/* =========================
   HELPERS
========================= */

function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function getInitials(name){

  const words =
    String(name || "Fan")
      .trim()
      .split(/\s+/)
      .filter(Boolean);

  if(!words.length){
    return "F";
  }

  if(words.length === 1){
    return words[0]
      .slice(0,2)
      .toUpperCase();
  }

  return (
    words[0][0] +
    words[words.length - 1][0]
  ).toUpperCase();

}


function formatTime(timestamp){

  if(!timestamp){
    return "now";
  }

  try{

    const date =
      timestamp.toDate
        ? timestamp.toDate()
        : new Date(timestamp);

    return date.toLocaleTimeString([],{
      hour:"numeric",
      minute:"2-digit"
    });

  }catch{

    return "now";

  }

}


function getTimestampValue(timestamp){

  if(!timestamp){
    return 0;
  }

  try{

    if(
      typeof timestamp.toMillis === "function"
    ){
      return timestamp.toMillis();
    }

    const value =
      new Date(timestamp).getTime();

    return isNaN(value)
      ? 0
      : value;

  }catch{

    return 0;

  }

}


function avatarHTML(profile,name){

  if(profile?.profileImage){

    return `
      <img
        src="${escapeHTML(profile.profileImage)}"
        alt="${escapeHTML(name)}"
      >
    `;

  }

  return escapeHTML(
    getInitials(name)
  );

}


async function getProfile(uid){

  try{

    const snap =
      await getDoc(
        doc(
          db,
          "publicProfiles",
          uid
        )
      );

    if(snap.exists()){
      return snap.data();
    }

  }catch(error){

    console.error(
      "Profile error:",
      error
    );

  }

  return {};

}


/* =========================
   STOP LISTENERS
========================= */

function stopMembersListener(){

  if(membersUnsubscribe){

    membersUnsubscribe();

    membersUnsubscribe =
      null;

  }

}


function stopInboxListener(){

  if(inboxUnsubscribe){

    inboxUnsubscribe();

    inboxUnsubscribe =
      null;

  }

}


function stopPrivateListener(){

  if(privateUnsubscribe){

    privateUnsubscribe();

    privateUnsubscribe =
      null;

  }

}


function stopCommunityListener(){

  if(communityUnsubscribe){

    communityUnsubscribe();

    communityUnsubscribe =
      null;

  }

}


/* =========================
   MESSAGE ELEMENT
========================= */

function createMessageElement(
  data,
  profile,
  otherName = "Fan"
){

  const senderName =
    data.senderName ||
    profile?.name ||
    (
      data.senderId === currentUser?.uid
        ? "You"
        : otherName
    );

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message-wrapper" +
    (
      data.senderId === currentUser?.uid
        ? " mine"
        : ""
    );

  wrapper.dataset.messageId =
    data.id || "";

  wrapper.dataset.timestamp =
    getTimestampValue(
      data.createdAt
    );

  wrapper.innerHTML = `

    <div class="message-avatar">
      ${avatarHTML(
        profile,
        senderName
      )}
    </div>

    <div class="message-content">

      <div class="sender-name">
        ${escapeHTML(senderName)}
      </div>

      <div class="message-bubble">
        ${escapeHTML(data.text || "")}
      </div>

      <div class="message-time">
        ${formatTime(data.createdAt)}
      </div>

    </div>

  `;

  return wrapper;

}


async function addMessageToContainer(
  container,
  data,
  otherName = "Fan"
){

  if(!data.id){
    return;
  }

  const existing =
    container.querySelector(
      `[data-message-id="${CSS.escape(data.id)}"]`
    );

  const profile =
    await getProfile(
      data.senderId
    );

  const element =
    createMessageElement(
      data,
      profile,
      otherName
    );

  if(existing){

    existing.replaceWith(
      element
    );

  }else{

    container.appendChild(
      element
    );

  }

  const messages =
    Array.from(
      container.querySelectorAll(
        ".message-wrapper"
      )
    );

  messages.sort(
    (a,b) =>
      Number(a.dataset.timestamp || 0) -
      Number(b.dataset.timestamp || 0)
  );

  messages.forEach(
    message =>
      container.appendChild(message)
  );

  container.scrollTop =
    container.scrollHeight;

}


/* =========================
   COMMUNITY
========================= */

function openCommunityListener(){

  stopCommunityListener();

  communityMessages.innerHTML = `
    <div class="loading">
      Loading community chat...
    </div>
  `;

  const messagesQuery =
    query(
      collection(
        db,
        "messages"
      ),
      limit(300)
    );

  let firstLoad = true;

  communityUnsubscribe =
    onSnapshot(

      messagesQuery,

      async(snapshot)=>{

        if(firstLoad){

          communityMessages.innerHTML = "";

          firstLoad = false;

        }

        for(
          const change of snapshot.docChanges()
        ){

          const data = {
            id:change.doc.id,
            ...change.doc.data()
          };

          if(
            change.type === "added" ||
            change.type === "modified"
          ){

            await addMessageToContainer(
              communityMessages,
              data
            );

          }

          if(change.type === "removed"){

            const existing =
              communityMessages.querySelector(
                `[data-message-id="${CSS.escape(data.id)}"]`
              );

            if(existing){
              existing.remove();
            }

          }

        }

        if(
          !communityMessages.querySelector(
            ".message-wrapper"
          )
        ){

          communityMessages.innerHTML = `
            <div class="list-empty">
              No messages yet.<br>
              Be the first to say hello!
            </div>
          `;

        }

      },

      error=>{

        console.error(
          "Community error:",
          error
        );

        communityMessages.innerHTML = `
          <div class="list-empty">

            Unable to load community messages.

            <br><br>

            <small>
              ${escapeHTML(
                error.code ||
                "Firestore error"
              )}

/* =========================
   MEMBERS
========================= */

function loadMembers(){

  if(!currentUser){
    return;
  }

  stopMembersListener();

  membersList.innerHTML = "";

  membersLoading.style.display =
    "block";

  membersLoading.textContent =
    "Loading members...";

  const membersQuery =
    query(
      collection(
        db,
        "publicProfiles"
      ),
      limit(300)
    );

  membersUnsubscribe =
    onSnapshot(

      membersQuery,

      snapshot=>{

        membersList.innerHTML = "";

        const users = [];

        snapshot.forEach(
          docSnap=>{

            const user =
              docSnap.data();

            const uid =
              docSnap.id;

            if(
              uid === currentUser.uid
            ){
              return;
            }

            users.push({
              uid,
              ...user
            });

          }
        );

        users.sort(
          (a,b)=>{

            const nameA =
              (
                a.name ||
                a.displayName ||
                a.email ||
                "Fan"
              ).toLowerCase();

            const nameB =
              (
                b.name ||
                b.displayName ||
                b.email ||
                "Fan"
              ).toLowerCase();

            return nameA.localeCompare(
              nameB
            );

          }
        );

        if(!users.length){

          membersLoading.style.display =
            "block";

          membersLoading.textContent =
            "No other members yet.";

          return;

        }

        membersLoading.style.display =
          "none";

        users.forEach(
          user=>{

            const name =
              user.name ||
              user.displayName ||
              user.email?.split("@")[0] ||
              "Fan";

            const card =
              document.createElement(
                "button"
              );

            card.type =
              "button";

            card.className =
              "person-card";

            card.innerHTML = `

              <div class="avatar">
                ${avatarHTML(
                  user,
                  name
                )}
              </div>

              <div class="person-info">

                <div class="person-name">
                  ${escapeHTML(name)}
                </div>

                <div class="person-email">
                  ${escapeHTML(
                    user.email || "Fan"
                  )}
                </div>

              </div>

            `;

            card.addEventListener(
              "click",
              ()=>{
                lastListView =
                  "members";

                showPrivateUser(user);
              }
            );

            membersList.appendChild(
              card
            );

          }
        );

      },

      error=>{

        console.error(
          "Members error:",
          error
        );

        membersLoading.style.display =
          "block";

        membersLoading.innerHTML = `
          Unable to load members.

          <br><br>

          <small>
            ${escapeHTML(
              error.code ||
              "Firestore error"
            )}
          </small>
        `;

      }

    );

}


/* =========================
   INBOX
========================= */

function loadInbox(){

  if(!currentUser){
    return;
  }

  stopInboxListener();

  inboxList.innerHTML = "";

  inboxLoading.style.display =
    "block";

  inboxLoading.textContent =
    "Loading conversations...";

  const inboxQuery =
    query(
      collection(
        db,
        "conversations"
      ),
      where(
        "participants",
        "array-contains",
        currentUser.uid
      ),
      limit(300)
    );

  inboxUnsubscribe =
    onSnapshot(

      inboxQuery,

      async snapshot=>{

        inboxList.innerHTML = "";

        if(snapshot.empty){

          inboxLoading.style.display =
            "block";

          inboxLoading.textContent =
            "No private conversations yet.";

          return;

        }

        inboxLoading.style.display =
          "none";

        const conversations = [];

        snapshot.forEach(
          docSnap=>{

            conversations.push({
              id:docSnap.id,
              ...docSnap.data()
            });

          }
        );

        conversations.sort(
          (a,b)=>
            getTimestampValue(
              b.updatedAt
            ) -
            getTimestampValue(
              a.updatedAt
            )
        );

        for(
          const conversation
          of conversations
        ){

          const otherUid =
            conversation.participants?.find(
              uid =>
                uid !== currentUser.uid
            );

          if(!otherUid){
            continue;
          }

          const profile =
            await getProfile(
              otherUid
            );

          const name =
            profile.name ||
            profile.displayName ||
            profile.email?.split("@")[0] ||
            "Fan";

          const card =
            document.createElement(
              "button"
            );

          card.type =
            "button";

          card.className =
            "conversation-card";

          card.innerHTML = `

            <div class="avatar">
              ${avatarHTML(
                profile,
                name
              )}
            </div>

            <div class="person-info">

              <div class="person-name">
                ${escapeHTML(name)}
              </div>

              <div class="conversation-preview">
                ${escapeHTML(
                  conversation.lastMessage ||
                  "No messages yet"
                )}
              </div>

            </div>

          `;

          card.addEventListener(
            "click",
            ()=>{

              lastListView =
                "inbox";

              showPrivateUser({
                uid:otherUid,
                ...profile
              });

            }
          );

          inboxList.appendChild(
            card
          );

        }

      },

      error=>{

        console.error(
          "Inbox error:",
          error
        );

        inboxLoading.style.display =
          "block";

        inboxLoading.innerHTML = `
          Unable to load inbox.

          <br><br>

          <small>
            ${escapeHTML(
              error.code ||
              "Firestore error"
            )}
          </small>
        `;

      }

    );

}

/* =========================
   PRIVATE CHAT
========================= */

async function openPrivateChat(uid){

  if(!currentUser){
    return;
  }

  stopPrivateListener();

  privateMessages.innerHTML = `
    <div class="loading">
      Loading conversation...
    </div>
  `;

  const ids = [
    currentUser.uid,
    uid
  ].sort();

  const conversationId =
    ids.join("_");

  currentConversationId =
    conversationId;

  const conversationRef =
    doc(
      db,
      "conversations",
      conversationId
    );

  try{

    const conversationSnap =
      await getDoc(
        conversationRef
      );

    if(!conversationSnap.exists()){

      await setDoc(
        conversationRef,
        {
          participants:ids,
          lastMessage:"",
          updatedAt:
            serverTimestamp()
        }
      );

    }

  }catch(error){

    console.error(
      "Conversation creation:",
      error
    );

  }

  const messagesQuery =
    query(
      collection(
        db,
        "conversations",
        conversationId,
        "messages"
      ),
      limit(300)
    );

  let firstLoad =
    true;

  privateUnsubscribe =
    onSnapshot(

      messagesQuery,

      async snapshot=>{

        if(firstLoad){

          privateMessages.innerHTML = "";

          firstLoad = false;

        }

        const otherName =
          currentPrivateUser?.name ||
          currentPrivateUser?.displayName ||
          currentPrivateUser?.email?.split("@")[0] ||
          "Fan";

        for(
          const change
          of snapshot.docChanges()
        ){

          const data = {
            id:change.doc.id,
            ...change.doc.data()
          };

          if(
            change.type === "added" ||
            change.type === "modified"
          ){

            await addMessageToContainer(
              privateMessages,
              data,
              otherName
            );

          }

          if(change.type === "removed"){

            const existing =
              privateMessages.querySelector(
                `[data-message-id="${CSS.escape(data.id)}"]`
              );

            if(existing){
              existing.remove();
            }

          }

        }

        if(
          !privateMessages.querySelector(
            ".message-wrapper"
          )
        ){

          privateMessages.innerHTML = `
            <div class="list-empty">
              No messages yet.<br>
              Say hello!
            </div>
          `;

        }

      },

      error=>{

        console.error(
          "Private chat error:",
          error
        );

        privateMessages.innerHTML = `
          <div class="list-empty">

            Unable to load private messages.

            <br><br>

            <small>
              ${escapeHTML(
                error.code ||
                "Firestore error"
              )}
            </small>

          </div>
        `;

      }

    );

}

/* =========================
   BACK BUTTON
========================= */

backButton.addEventListener(
  "click",
  ()=>{

    /*
      PRIVATE CHAT
      Return to the list
    */

    if(currentView === "private"){

      stopPrivateListener();

      currentPrivateUser =
        null;

      currentConversationId =
        null;

      chatApp.classList.remove(
        "chat-open"
      );

      privateChatView.classList.remove(
        "active"
      );

      composer.style.display =
        "none";

      backButton.style.display =
        "none";

      if(lastListView === "inbox"){

        openInbox();

      }else{

        openMembers();

      }

      return;

    }


    /*
      COMMUNITY / INBOX / MEMBERS
      Back goes to dashboard
    */

    if(
      currentView === "community" ||
      currentView === "inbox" ||
      currentView === "members"
    ){

      window.location.href =
        "dashboard.html";

    }

  }
);


/* =========================
   SEND MESSAGE
========================= */

messageForm.addEventListener(
  "submit",
  async(event)=>{

    event.preventDefault();

    const text =
      messageInput.value.trim();

    if(!text){
      return;
    }

    if(!currentUser){
      return;
    }

    messageInput.disabled =
      true;

    try{

      const senderName =
        currentUserProfile?.name ||
        currentUserProfile?.displayName ||
        currentUser.email?.split("@")[0] ||
        "Fan";


      /* PRIVATE */

      if(
        currentPrivateUser &&
        currentView === "private"
      ){

        const conversationId =
          currentConversationId;

        if(!conversationId){

          throw new Error(
            "No conversation selected."
          );

        }

        const conversationRef =
          doc(
            db,
            "conversations",
            conversationId
          );

        await setDoc(
          conversationRef,
          {
            participants:[
              currentUser.uid,
              currentPrivateUser.uid
            ].sort(),

            lastMessage:text,

            updatedAt:
              serverTimestamp()

          },
          {
            merge:true
          }
        );

        await addDoc(
          collection(
            db,
            "conversations",
            conversationId,
            "messages"
          ),
          {
            text:text,

            senderId:
              currentUser.uid,

            senderName:
              senderName,

            createdAt:
              serverTimestamp()
          }
        );

      }


      /* COMMUNITY */

      else if(
        currentView === "community"
      ){

        await addDoc(
          collection(
            db,
            "messages"
          ),
          {
            text:text,

            senderId:
              currentUser.uid,

            senderName:
              senderName,

            createdAt:
              serverTimestamp()
          }
        );

      }

      messageInput.value =
        "";

    }catch(error){

      console.error(
        "Send message error:",
        error
      );

      alert(
        "Unable to send message. Please try again."
      );

    }finally{

      messageInput.disabled =
        false;

      messageInput.focus();

    }

  }
);


/* =========================
   AUTH
========================= */

onAuthStateChanged(
  auth,
  async(user)=>{

    if(!user){

      window.location.replace(
        "login.html"
      );

      return;

    }

    currentUser =
      user;

    currentUserProfile =
      await getProfile(
        user.uid
      );

    /*
      IMPORTANT:
      Open Message now starts at
      INBOX instead of forcing
      Community.
    */

    openInbox();

    /*
      Only show the app after the
      correct screen is ready.
    */

    chatApp.classList.remove(
      "loading-app"
    );

  }
);
