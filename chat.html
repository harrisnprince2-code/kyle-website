<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kyle | Fan Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        radial-gradient(circle at 80% 0%, rgba(100, 10, 45, 0.25), transparent 30%),
        #030303;
    }
    header {
      height: 78px;
      padding: 0 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 3, 3, 0.95);
      border-bottom: 1px solid rgba(120, 20, 55, 0.35);
    }
    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 8px;
    }
    .back {
      color: #a52a50;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
    }
    .chat-container {
      width: 92%;
      max-width: 1000px;
      height: calc(100vh - 120px);
      min-height: 600px;
      margin: 25px auto;
      display: grid;
      grid-template-columns: 280px 1fr;
      overflow: hidden;
      border: 1px solid rgba(120, 20, 55, 0.35);
      border-radius: 20px;
      background: rgba(8, 8, 8, 0.92);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
    }
    /* SIDEBAR */
    .sidebar {
      border-right: 1px solid rgba(120, 20, 55, 0.25);
      background: rgba(20, 3, 10, 0.4);
    }
    .sidebar-title {
      padding: 25px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .sidebar-title p {
      color: #922047;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 7px;
    }
    .sidebar-title h2 {
      font-size: 20px;
    }
    .chat-user {
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 13px;
      cursor: pointer;
      background: rgba(100, 10, 45, 0.12);
      border-left: 2px solid #8d1d45;
    }
    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #4b0925, #12030a);
      border: 1px solid rgba(145, 35, 75, 0.5);
      color: #b1325c;
      font-size: 11px;
      font-weight: bold;
    }
    .chat-user h3 {
      font-size: 14px;
      margin-bottom: 3px;
    }
    .online {
      color: #777;
      font-size: 11px;
    }
    /* CHAT */
    .chat {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .chat-header {
      height: 76px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .chat-header h2 {
      font-size: 16px;
    }
    .chat-header p {
      color: #777;
      font-size: 11px;
      margin-top: 3px;
    }
    .messages {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 70%;
      padding: 13px 17px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
    }
    .received {
      align-self: flex-start;
      color: #bbb;
      background: rgba(255,255,255,0.045);
      border: 1px solid rgba(255,255,255,0.06);
      border-bottom-left-radius: 4px;
    }
    .sent {
      align-self: flex-end;
      background: linear-gradient(135deg, #43091e, #7d1639);
      border-bottom-right-radius: 4px;
    }
    .time {
      display: block;
      margin-top: 5px;
      color: #666;
      font-size: 9px;
    }
    .sent .time {
      color: #c48aa0;
    }
    /* INPUT */
    .chat-input {
      padding: 18px;
      display: flex;
      gap: 10px;
      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(3,3,3,0.7);
    }
    .chat-input input {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      color: white;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(120,20,55,0.3);
      border-radius: 7px;
      outline: none;
      font-size: 13px;
    }
    .chat-input input:focus {
      border-color: #8e1d43;
    }
    .send {
      padding: 0 22px;
      border: none;
      border-radius: 7px;
      color: white;
      background: linear-gradient(135deg, #43091e, #7d1639);
      font-weight: bold;
      cursor: pointer;
    }
    .send:hover {
      background: linear-gradient(135deg, #5a0c28, #941e49);
    }
    @media (max-width: 700px) {
      .chat-container {
        width: 94%;
        height: calc(100vh - 110px);
        min-height: 550px;
        grid-template-columns: 1fr;
      }
      .sidebar {
        display: none;
      }
      .message {
        max-width: 85%;
      }
      .messages {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      KYLE
    </div>
    <a href="dashboard.html" class="back">
      ← DASHBOARD
    </a>
  </header>
  <main class="chat-container">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-title">
        <p>COMMUNITY</p>
        <h2>Fan Chat</h2>
      </div>
      <div class="chat-user">
        <div class="avatar">
          KF
        </div>
        <div>
          <h3>Official Community</h3>
          <span class="online">
            Community chat
          </span>
        </div>
      </div>
    </aside>
    <!-- CHAT -->
    <section class="chat">
      <div class="chat-header">
        <div class="avatar">
          KF
        </div>
        <div>
          <h2>Official Community</h2>
          <p>Fan discussion</p>
        </div>
      </div>
      <div class="messages" id="messages">
        <div class="message received">
          Welcome to the Kyle fan community! 👋
          <span class="time">
            Today
          </span>
        </div>
        <div class="message received">
          This is the place for fans to connect
          and share their thoughts.
          <span class="time">
            Today
          </span>
        </div>
      </div>
      <form class="chat-input" onsubmit="sendMessage(event)">
        <input
          id="messageInput"
          type="text"
          placeholder="Write a message..."
          autocomplete="off"
          required
        >
        <button class="send" type="submit">
          SEND
        </button>
      </form>
    </section>
  </main>
  <script>
    function sendMessage(event) {
      event.preventDefault();
      const input = document.getElementById("messageInput");
      const messages = document.getElementById("messages");
      const text = input.value.trim();
      if (text === "") {
        return;
      }
      const message = document.createElement("div");
      message.className = "message sent";
      message.innerHTML =
        text +
        '<span class="time">Just now</span>';
      messages.appendChild(message);
      input.value = "";
      messages.scrollTop = messages.scrollHeight;
    }
  </script>
</body>
</html>
